<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>打卡</title>
  <meta name="description" content="工作日打卡记录与出勤统计">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1a2332;
      --ink-soft: rgba(26, 35, 50, 0.72);
      --ink-faint: rgba(26, 35, 50, 0.45);
      --paper: #f5f0e8;
      --paper-deep: #ebe4d8;
      --surface: #fffcf7;
      --line: rgba(26, 35, 50, 0.1);
      --line-strong: rgba(26, 35, 50, 0.18);
      --stamp: #c45c4a;
      --ok: #3d8b6e;
      --ok-soft: rgba(61, 139, 110, 0.16);
      --half: #d4a056;
      --half-soft: rgba(212, 160, 86, 0.18);
      --leave: #6b5b95;
      --leave-soft: rgba(107, 91, 149, 0.16);
      --holiday: #8b6f5c;
      --holiday-soft: rgba(139, 111, 92, 0.14);
      --weekend: rgba(26, 35, 50, 0.06);
      --accent: #2a6f97;
      --accent-soft: rgba(42, 111, 151, 0.12);
      --pass: #2d8a4e;
      --fail: #b84a3a;
      --font-display: "DM Serif Display", "Songti SC", serif;
      --font-sans: "IBM Plex Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
      --radius: 14px;
      --radius-sm: 8px;
      --shadow: 0 12px 40px rgba(26, 35, 50, 0.08);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --sheet-h: 0px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { color-scheme: light; }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.5;
      color: var(--ink);
      background: linear-gradient(180deg, var(--paper) 0%, #efe9df 100%);
      padding: calc(16px + var(--safe-top)) 14px calc(16px + var(--safe-bottom));
      padding-bottom: calc(16px + var(--safe-bottom) + var(--sheet-h));
    }

    body.sheet-open { --sheet-h: 320px; }

    .app { max-width: 960px; margin: 0 auto; display: grid; gap: 16px; }

    .hero { display: grid; gap: 6px; }
    .hero__title {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      font-weight: 400;
    }
    .hero__sub { margin: 0; color: var(--ink-soft); font-size: 14px; }

    .guide {
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      background: var(--accent-soft);
      border: 1px solid rgba(42, 111, 151, 0.2);
      font-size: 13px;
      color: var(--ink-soft);
      line-height: 1.55;
    }
    .guide strong { color: var(--ink); font-weight: 600; }

    .quick-bar { display: flex; flex-wrap: wrap; gap: 8px; }

    .btn {
      appearance: none;
      border: none;
      cursor: pointer;
      font: inherit;
      font-weight: 500;
      border-radius: 999px;
      padding: 0 16px;
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.12s, background 0.12s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .btn:active { transform: scale(0.97); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn--primary { background: var(--stamp); color: #fff; }
    .btn--half { background: var(--half); color: #fff; }
    .btn--ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); }
    .btn--sm { min-height: 34px; padding: 0 12px; font-size: 13px; }
    .btn--block { width: 100%; border-radius: var(--radius-sm); min-height: 44px; }
    .btn--chip {
      min-height: 40px;
      padding: 0 12px;
      font-size: 14px;
      border-radius: var(--radius-sm);
      background: var(--surface);
      border: 1px solid var(--line);
      width: 100%;
    }
    .btn--chip.is-active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }
    .btn--chip.is-on {
      background: var(--ok-soft);
      border-color: var(--ok);
      color: var(--ok);
    }

    .month-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      align-items: start;
    }
    @media (max-width: 720px) { .month-grid { grid-template-columns: 1fr; } }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .card__head {
      padding: 12px 14px 8px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .card__title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 400;
    }
    .card__nav { display: flex; gap: 4px; }
    .card__body { padding: 12px 14px 14px; }

    .stat-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .stat {
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      background: var(--paper);
    }
    .stat__label { font-size: 11px; color: var(--ink-faint); }
    .stat__value { font-family: var(--font-mono); font-size: 1rem; font-weight: 500; }

    .ratio-block {
      padding: 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      margin-bottom: 6px;
      font-size: 12px;
    }
    .ratio-block__row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      color: var(--ink-soft);
    }
    .badge {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 999px;
      font-weight: 500;
    }
    .badge--pass { background: rgba(45, 138, 78, 0.14); color: var(--pass); }
    .badge--fail { background: rgba(184, 74, 58, 0.12); color: var(--fail); }
    .ratio-bar {
      height: 6px;
      border-radius: 999px;
      background: var(--paper-deep);
      overflow: hidden;
      position: relative;
    }
    .ratio-bar__fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--ok));
      transition: width 0.35s var(--ease);
    }
    .ratio-bar__mark {
      position: absolute;
      top: -2px; bottom: -2px;
      width: 2px;
      background: var(--stamp);
      left: 40%;
      opacity: 0.75;
    }

    .cal {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-top: 10px;
    }
    .cal__wd {
      text-align: center;
      font-size: 11px;
      color: var(--ink-faint);
      padding: 2px 0 4px;
    }
    .cal__cell {
      aspect-ratio: 1;
      min-height: 36px;
      border: 1.5px solid transparent;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--ink);
      display: grid;
      place-items: center;
      position: relative;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .cal__cell:hover:not(:disabled) { background: var(--paper); }
    .cal__cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .cal__cell:disabled { visibility: hidden; pointer-events: none; }
    .cal__cell.is-today::after {
      content: "";
      position: absolute;
      bottom: 3px;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--stamp);
    }
    .cal__cell.is-weekend { color: var(--ink-faint); background: var(--weekend); }
    .cal__cell.is-full { background: var(--ok-soft); color: var(--ok); font-weight: 600; }
    .cal__cell.is-half { background: var(--half-soft); color: var(--half); font-weight: 600; }
    .cal__cell.is-holiday { background: var(--holiday-soft); color: var(--holiday); }
    .cal__cell.is-leave { background: var(--leave-soft); color: var(--leave); }
    .cal__cell.is-selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
      z-index: 1;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      font-size: 11px;
      color: var(--ink-soft);
    }
    .legend__item { display: flex; align-items: center; gap: 5px; }
    .legend__swatch { width: 10px; height: 10px; border-radius: 2px; }

    /* Fixed bottom sheet */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(26, 35, 50, 0.35);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    .sheet-backdrop.is-open { opacity: 1; pointer-events: auto; }

    .sheet {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 201;
      background: var(--surface);
      border-radius: var(--radius) var(--radius) 0 0;
      box-shadow: 0 -8px 40px rgba(26, 35, 50, 0.15);
      padding: 12px 16px calc(16px + var(--safe-bottom));
      transform: translateY(100%);
      transition: transform 0.3s var(--ease);
      max-height: 85dvh;
      overflow-y: auto;
    }
    .sheet.is-open { transform: translateY(0); }

    .sheet__handle {
      width: 36px; height: 4px;
      border-radius: 999px;
      background: var(--line-strong);
      margin: 0 auto 12px;
    }
    .sheet__date {
      font-family: var(--font-display);
      font-size: 1.2rem;
      margin-bottom: 4px;
    }
    .sheet__meta {
      font-size: 13px;
      color: var(--ink-soft);
      margin-bottom: 14px;
    }
    .sheet__section {
      margin-bottom: 12px;
    }
    .sheet__label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 8px;
    }
    .sheet__grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .sheet__footer {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }
    .sheet__footer .btn { flex: 1; border-radius: var(--radius-sm); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(24px + var(--safe-bottom));
      transform: translateX(-50%) translateY(16px);
      padding: 10px 18px;
      border-radius: 999px;
      background: var(--ink);
      color: #fff;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 300;
    }
    .toast.is-visible { opacity: 1; transform: translateX(-50%) translateY(0); }
    body.sheet-open .toast { bottom: calc(var(--sheet-h) + 12px); }

    @media (prefers-reduced-motion: reduce) {
      .sheet, .sheet-backdrop, .ratio-bar__fill, .btn, .toast { transition: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="hero">
      <h1 class="hero__title">打卡</h1>
      <p class="hero__sub">点击日历中的日期进行补打卡、半天打卡或标记放假/请假</p>
    </header>

    <div class="guide">
      <strong>怎么用：</strong>点日历里任意一天 → 底部弹出操作面板 → 选择「全天打卡」「半天打卡」「放假日」或「半天请假」→ 点<strong>确认</strong>。
      双休日默认放假；法定节假日可点「导入法定节假日」批量标记。
    </div>

    <div class="quick-bar">
      <button type="button" class="btn btn--primary" data-quick="full">今日全天打卡</button>
      <button type="button" class="btn btn--half" data-quick="half">今日半天打卡</button>
      <button type="button" class="btn btn--ghost btn--sm" data-action="import-holidays">导入法定节假日</button>
      <button type="button" class="btn btn--ghost btn--sm" data-action="export">导出</button>
      <label class="btn btn--ghost btn--sm" style="cursor:pointer">
        导入
        <input type="file" id="importFile" accept="application/json" hidden>
      </label>
    </div>

    <div class="month-grid" id="monthGrid"></div>

    <div class="legend" id="legend"></div>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop" aria-hidden="true"></div>
  <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetDate">
    <div class="sheet__handle"></div>
    <div class="sheet__date" id="sheetDate"></div>
    <p class="sheet__meta" id="sheetMeta"></p>

    <div class="sheet__section">
      <div class="sheet__label">打卡 / 补卡</div>
      <div class="sheet__grid" id="checkinActions"></div>
    </div>

    <div class="sheet__section">
      <div class="sheet__label">日期标记</div>
      <div class="sheet__grid" id="markActions"></div>
    </div>

    <div class="sheet__footer">
      <button type="button" class="btn btn--ghost" id="btnSheetClose">取消</button>
      <button type="button" class="btn btn--primary" id="btnSheetConfirm" disabled>确认</button>
    </div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      "use strict";

      var STORAGE_KEY = "daka-data-v1";
      var THRESHOLD = 0.4;
      var WEEKDAYS = ["日", "一", "二", "三", "四", "五", "六"];

      var CN_HOLIDAYS = {
        2025: [
          "2025-01-01",
          "2025-01-28", "2025-01-29", "2025-01-30", "2025-01-31",
          "2025-02-01", "2025-02-02", "2025-02-03", "2025-02-04",
          "2025-04-04", "2025-04-05", "2025-04-06",
          "2025-05-01", "2025-05-02", "2025-05-03", "2025-05-04", "2025-05-05",
          "2025-05-31", "2025-06-01", "2025-06-02",
          "2025-10-01", "2025-10-02", "2025-10-03", "2025-10-04",
          "2025-10-05", "2025-10-06", "2025-10-07", "2025-10-08"
        ],
        2026: [
          "2026-01-01", "2026-01-02", "2026-01-03",
          "2026-02-15", "2026-02-16", "2026-02-17", "2026-02-18",
          "2026-02-19", "2026-02-20", "2026-02-21", "2026-02-22", "2026-02-23",
          "2026-04-04", "2026-04-05", "2026-04-06",
          "2026-05-01", "2026-05-02", "2026-05-03", "2026-05-04", "2026-05-05",
          "2026-06-19", "2026-06-20", "2026-06-21",
          "2026-09-25", "2026-09-26", "2026-09-27",
          "2026-10-01", "2026-10-02", "2026-10-03", "2026-10-04",
          "2026-10-05", "2026-10-06", "2026-10-07"
        ]
      };

      var CHECKIN_ACTIONS = [
        { id: "checkin-full", label: "全天打卡", hint: "计 1 天" },
        { id: "checkin-half", label: "半天打卡", hint: "特殊情况" },
        { id: "clear-checkin", label: "清除打卡", hint: "移除记录" }
      ];

      var MARK_ACTIONS = [
        { id: "holiday-toggle", label: "放假日", hint: "工作日放假" },
        { id: "leave-toggle", label: "半天请假", hint: "工作日 -0.5" }
      ];

      var today = new Date();
      var state = {
        data: loadData(),
        selectedKey: null,
        pendingAction: null,
        months: [
          { slot: "prev", year: 0, month: 0 },
          { slot: "curr", year: 0, month: 0 }
        ]
      };

      initMonthSlots();

      function initMonthSlots() {
        var cy = today.getFullYear();
        var cm = today.getMonth() + 1;
        state.months[1].year = cy;
        state.months[1].month = cm;
        if (cm === 1) {
          state.months[0].year = cy - 1;
          state.months[0].month = 12;
        } else {
          state.months[0].year = cy;
          state.months[0].month = cm - 1;
        }
      }

      function pad(n) { return n < 10 ? "0" + n : String(n); }
      function dateKey(y, m, d) { return y + "-" + pad(m) + "-" + pad(d); }
      function parseKey(key) {
        var p = key.split("-");
        return new Date(+p[0], +p[1] - 1, +p[2]);
      }
      function isWeekend(date) {
        var w = date.getDay();
        return w === 0 || w === 6;
      }

      function loadData() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            var parsed = JSON.parse(raw);
            return {
              checkins: parsed.checkins || {},
              holidays: parsed.holidays || [],
              onleave: parsed.onleave || {}
            };
          }
        } catch (e) { /* ignore */ }
        return { checkins: {}, holidays: [], onleave: {} };
      }

      function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
      }

      function isHoliday(key) { return state.data.holidays.indexOf(key) !== -1; }
      function isOnLeave(key) { return !!state.data.onleave[key]; }
      function getCheckin(key) { return state.data.checkins[key] || null; }

      function workDayWeight(key) {
        var date = parseKey(key);
        if (isWeekend(date)) return 0;
        if (isHoliday(key)) return 0;
        if (isOnLeave(key)) return 0.5;
        return 1;
      }

      function checkinWeight(key, halfAsFull) {
        var c = getCheckin(key);
        if (c === "full") return 1;
        if (c === "half") return halfAsFull ? 1 : 0.5;
        return 0;
      }

      function monthStats(year, month) {
        var days = new Date(year, month, 0).getDate();
        var workDays = 0, checkFull = 0, checkHalf = 0, checkedDays = 0;
        for (var d = 1; d <= days; d++) {
          var key = dateKey(year, month, d);
          workDays += workDayWeight(key);
          checkFull += checkinWeight(key, true);
          checkHalf += checkinWeight(key, false);
          if (getCheckin(key)) checkedDays++;
        }
        return {
          workDays: workDays,
          checkFull: checkFull,
          checkHalf: checkHalf,
          checkedDays: checkedDays,
          ratioFull: workDays > 0 ? checkFull / workDays : 0,
          ratioHalf: workDays > 0 ? checkHalf / workDays : 0
        };
      }

      function formatMonth(y, m) { return y + "年" + m + "月"; }

      function formatDateLabel(key) {
        var d = parseKey(key);
        return d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日 周" + WEEKDAYS[d.getDay()];
      }

      function dayMeta(key) {
        var parts = [];
        var date = parseKey(key);
        if (isWeekend(date)) parts.push("双休日（默认放假）");
        if (isHoliday(key)) parts.push("已标记放假日");
        if (isOnLeave(key)) parts.push("半天请假");
        var c = getCheckin(key);
        if (c === "full") parts.push("已打卡·全天");
        else if (c === "half") parts.push("已打卡·半天");
        else if (!parts.length) parts.push("工作日，未打卡");
        else if (!c) parts.push("未打卡");
        return parts.join(" · ");
      }

      function cellClass(key) {
        var c = getCheckin(key);
        if (c === "full") return "is-full";
        if (c === "half") return "is-half";
        if (isOnLeave(key)) return "is-leave";
        if (isHoliday(key)) return "is-holiday";
        if (isWeekend(parseKey(key))) return "is-weekend";
        return "";
      }

      function showToast(msg) {
        var el = document.getElementById("toast");
        el.textContent = msg;
        el.classList.add("is-visible");
        clearTimeout(showToast._t);
        showToast._t = setTimeout(function () { el.classList.remove("is-visible"); }, 2200);
      }

      function ratioHtml(label, ratio, val, work) {
        var pct = Math.round(ratio * 1000) / 10;
        var pass = ratio >= THRESHOLD;
        return (
          '<div class="ratio-block">' +
            '<div class="ratio-block__row"><span>' + label + '</span>' +
            '<span class="badge ' + (pass ? "badge--pass" : "badge--fail") + '">' + (pass ? "≥40%" : "<40%") + '</span></div>' +
            '<div class="ratio-bar"><div class="ratio-bar__fill" style="width:' + Math.min(100, pct) + '%"></div><div class="ratio-bar__mark"></div></div>' +
            '<div style="margin-top:4px;color:var(--ink-soft)">' + val + ' / ' + work + ' 工作日 = ' + pct + '%</div>' +
          '</div>'
        );
      }

      function buildCalendarHtml(year, month) {
        var days = new Date(year, month, 0).getDate();
        var firstWd = new Date(year, month - 1, 1).getDay();
        var todayKey = dateKey(today.getFullYear(), today.getMonth() + 1, today.getDate());
        var html = '<div class="cal" role="grid">';
        WEEKDAYS.forEach(function (w) {
          html += '<div class="cal__wd" role="columnheader">' + w + '</div>';
        });
        for (var i = 0; i < firstWd; i++) {
          html += '<button type="button" class="cal__cell" disabled></button>';
        }
        for (var d = 1; d <= days; d++) {
          var key = dateKey(year, month, d);
          var cls = ["cal__cell", cellClass(key)];
          if (key === todayKey) cls.push("is-today");
          if (key === state.selectedKey) cls.push("is-selected");
          html += '<button type="button" class="' + cls.join(" ") + '" data-key="' + key + '" aria-label="' + formatDateLabel(key) + '">' + d + '</button>';
        }
        html += '</div>';
        return html;
      }

      function renderMonths() {
        var grid = document.getElementById("monthGrid");
        grid.innerHTML = state.months.map(function (slot, idx) {
          var s = monthStats(slot.year, slot.month);
          var slotLabel = idx === 0 ? "上月" : "本月";
          return (
            '<article class="card" data-slot="' + idx + '">' +
              '<div class="card__head">' +
                '<h2 class="card__title">' + slotLabel + ' · ' + formatMonth(slot.year, slot.month) + '</h2>' +
                '<div class="card__nav">' +
                  '<button type="button" class="btn btn--ghost btn--sm" data-nav="prev" data-slot="' + idx + '" aria-label="上个月">‹</button>' +
                  '<button type="button" class="btn btn--ghost btn--sm" data-nav="next" data-slot="' + idx + '" aria-label="下个月">›</button>' +
                '</div>' +
              '</div>' +
              '<div class="card__body">' +
                '<div class="stat-row">' +
                  '<div class="stat"><div class="stat__label">工作日</div><div class="stat__value">' + s.workDays + '</div></div>' +
                  '<div class="stat"><div class="stat__label">有打卡</div><div class="stat__value">' + s.checkedDays + ' 天</div></div>' +
                '</div>' +
                ratioHtml("半天按一天算", s.ratioFull, s.checkFull, s.workDays) +
                ratioHtml("半天按半天算", s.ratioHalf, s.checkHalf, s.workDays) +
                buildCalendarHtml(slot.year, slot.month) +
              '</div>' +
            '</article>'
          );
        }).join("");
      }

      function renderLegend() {
        var items = [
          { bg: "var(--ok-soft)", label: "全天打卡" },
          { bg: "var(--half-soft)", label: "半天打卡" },
          { bg: "var(--holiday-soft)", label: "放假日" },
          { bg: "var(--leave-soft)", label: "半天请假" },
          { bg: "var(--weekend)", label: "双休日" }
        ];
        document.getElementById("legend").innerHTML = items.map(function (it) {
          return '<span class="legend__item"><span class="legend__swatch" style="background:' + it.bg + '"></span>' + it.label + '</span>';
        }).join("");
      }

      function openSheet(key) {
        state.selectedKey = key;
        state.pendingAction = null;
        document.body.classList.add("sheet-open");
        document.getElementById("sheetBackdrop").classList.add("is-open");
        document.getElementById("sheet").classList.add("is-open");
        document.getElementById("sheetDate").textContent = formatDateLabel(key);
        document.getElementById("sheetMeta").textContent = dayMeta(key);
        renderSheetActions();
        renderMonths();
      }

      function closeSheet() {
        state.pendingAction = null;
        document.body.classList.remove("sheet-open");
        document.getElementById("sheetBackdrop").classList.remove("is-open");
        document.getElementById("sheet").classList.remove("is-open");
        state.selectedKey = null;
        renderMonths();
      }

      function actionBtnHtml(a, key) {
        var active = state.pendingAction === a.id ? " is-active" : "";
        var on = "";
        if (a.id === "holiday-toggle" && isHoliday(key)) on = " is-on";
        if (a.id === "leave-toggle" && isOnLeave(key)) on = " is-on";
        return (
          '<button type="button" class="btn btn--chip' + active + on + '" data-pending="' + a.id + '">' +
            a.label + '<span style="display:block;font-size:11px;font-weight:400;opacity:.7">' + a.hint + '</span>' +
          '</button>'
        );
      }

      function renderSheetActions() {
        var key = state.selectedKey;
        if (!key) return;
        document.getElementById("checkinActions").innerHTML = CHECKIN_ACTIONS.map(function (a) {
          return actionBtnHtml(a, key);
        }).join("");
        document.getElementById("markActions").innerHTML = MARK_ACTIONS.map(function (a) {
          return actionBtnHtml(a, key);
        }).join("");
        document.getElementById("btnSheetConfirm").disabled = !state.pendingAction;
      }

      function applyAction(key, action) {
        var date = parseKey(key);
        if (action === "checkin-full") {
          state.data.checkins[key] = "full";
        } else if (action === "checkin-half") {
          state.data.checkins[key] = "half";
        } else if (action === "clear-checkin") {
          delete state.data.checkins[key];
        } else if (action === "holiday-toggle") {
          if (isWeekend(date)) {
            showToast("双休日已默认放假");
            return false;
          }
          var hi = state.data.holidays.indexOf(key);
          if (hi === -1) state.data.holidays.push(key);
          else state.data.holidays.splice(hi, 1);
        } else if (action === "leave-toggle") {
          if (isWeekend(date) || isHoliday(key)) {
            showToast("只能在工作日标记请假");
            return false;
          }
          if (isOnLeave(key)) delete state.data.onleave[key];
          else state.data.onleave[key] = "half";
        }
        saveData();
        return true;
      }

      function confirmSheet() {
        if (!state.selectedKey || !state.pendingAction) return;
        var action = state.pendingAction;
        var ok = applyAction(state.selectedKey, action);
        if (!ok) return;
        var msgs = {
          "checkin-full": "已全天打卡",
          "checkin-half": "已半天打卡",
          "clear-checkin": "已清除打卡",
          "holiday-toggle": isHoliday(state.selectedKey) ? "已标记放假日" : "已取消放假日",
          "leave-toggle": isOnLeave(state.selectedKey) ? "已标记半天请假" : "已取消请假"
        };
        showToast(msgs[action] || "已保存");
        state.pendingAction = null;
        document.getElementById("sheetMeta").textContent = dayMeta(state.selectedKey);
        renderSheetActions();
        renderMonths();
      }

      function quickCheckin(full) {
        var key = dateKey(today.getFullYear(), today.getMonth() + 1, today.getDate());
        state.data.checkins[key] = full ? "full" : "half";
        saveData();
        showToast(full ? "今日全天打卡成功" : "今日半天打卡成功");
        renderMonths();
      }

      function shiftMonth(slotIdx, dir) {
        var slot = state.months[slotIdx];
        if (dir === "prev") {
          slot.month--;
          if (slot.month < 1) { slot.month = 12; slot.year--; }
        } else {
          slot.month++;
          if (slot.month > 12) { slot.month = 1; slot.year++; }
        }
        renderMonths();
      }

      function importCnHolidays() {
        var year = today.getFullYear();
        var list = CN_HOLIDAYS[year];
        if (!list) {
          showToast("暂无 " + year + " 年法定假日数据");
          return;
        }
        var added = 0;
        list.forEach(function (key) {
          if (state.data.holidays.indexOf(key) === -1) {
            state.data.holidays.push(key);
            added++;
          }
        });
        saveData();
        renderMonths();
        showToast("已导入 " + year + " 年法定假日 " + added + " 天");
      }

      function render() {
        renderMonths();
        renderLegend();
      }

      // Event delegation — survives innerHTML re-renders
      document.addEventListener("click", function (e) {
        var calCell = e.target.closest(".cal__cell[data-key]");
        if (calCell) {
          e.preventDefault();
          openSheet(calCell.getAttribute("data-key"));
          return;
        }

        var navBtn = e.target.closest("[data-nav]");
        if (navBtn) {
          shiftMonth(+navBtn.getAttribute("data-slot"), navBtn.getAttribute("data-nav"));
          return;
        }

        var pendingBtn = e.target.closest("[data-pending]");
        if (pendingBtn) {
          state.pendingAction = pendingBtn.getAttribute("data-pending");
          renderSheetActions();
          return;
        }

        var quickBtn = e.target.closest("[data-quick]");
        if (quickBtn) {
          quickCheckin(quickBtn.getAttribute("data-quick") === "full");
          return;
        }

        if (e.target.closest("[data-action=import-holidays]")) {
          importCnHolidays();
          return;
        }

        if (e.target.closest("[data-action=export]")) {
          var blob = new Blob([JSON.stringify(state.data, null, 2)], { type: "application/json" });
          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "daka-backup-" + dateKey(today.getFullYear(), today.getMonth() + 1, today.getDate()) + ".json";
          a.click();
          URL.revokeObjectURL(a.href);
          showToast("已导出");
          return;
        }

        if (e.target.id === "btnSheetConfirm") {
          confirmSheet();
          return;
        }

        if (e.target.id === "btnSheetClose" || e.target.id === "sheetBackdrop") {
          closeSheet();
        }
      });

      document.getElementById("importFile").addEventListener("change", function (ev) {
        var file = ev.target.files && ev.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          try {
            var parsed = JSON.parse(reader.result);
            state.data = {
              checkins: parsed.checkins || {},
              holidays: parsed.holidays || [],
              onleave: parsed.onleave || {}
            };
            saveData();
            render();
            showToast("导入成功");
          } catch (err) {
            showToast("导入失败");
          }
        };
        reader.readAsText(file);
        ev.target.value = "";
      });

      render();
    })();
  </script>
</body>
</html>
