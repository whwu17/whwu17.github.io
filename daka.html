<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>打卡</title>
  <meta name="description" content="工作日打卡记录与出勤统计">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1a2332;
      --ink-soft: rgba(26, 35, 50, 0.72);
      --ink-faint: rgba(26, 35, 50, 0.45);
      --paper: #f5f0e8;
      --paper-deep: #ebe4d8;
      --surface: #fffcf7;
      --line: rgba(26, 35, 50, 0.1);
      --line-strong: rgba(26, 35, 50, 0.18);
      --stamp: #c45c4a;
      --stamp-soft: rgba(196, 92, 74, 0.14);
      --ok: #3d8b6e;
      --ok-soft: rgba(61, 139, 110, 0.16);
      --half: #d4a056;
      --half-soft: rgba(212, 160, 86, 0.18);
      --leave: #6b5b95;
      --leave-soft: rgba(107, 91, 149, 0.16);
      --holiday: #8b6f5c;
      --holiday-soft: rgba(139, 111, 92, 0.14);
      --weekend: rgba(26, 35, 50, 0.06);
      --accent: #2a6f97;
      --accent-soft: rgba(42, 111, 151, 0.12);
      --pass: #2d8a4e;
      --fail: #b84a3a;
      --font-display: "DM Serif Display", "Songti SC", "Noto Serif SC", serif;
      --font-sans: "IBM Plex Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
      --radius: 14px;
      --radius-sm: 8px;
      --shadow: 0 12px 40px rgba(26, 35, 50, 0.08);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { color-scheme: light; }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.5;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(42, 111, 151, 0.08), transparent),
        linear-gradient(180deg, var(--paper) 0%, #efe9df 100%);
      padding: calc(20px + var(--safe-top)) 16px calc(24px + var(--safe-bottom));
    }

    .app {
      max-width: 920px;
      margin: 0 auto;
      display: grid;
      gap: 20px;
    }

    .hero {
      display: grid;
      gap: 6px;
    }

    .hero__eyebrow {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }

    .hero__title {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(2rem, 6vw, 2.75rem);
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .hero__sub {
      margin: 0;
      color: var(--ink-soft);
      max-width: 42ch;
    }

    .quick-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .btn {
      appearance: none;
      border: none;
      cursor: pointer;
      font: inherit;
      font-weight: 500;
      border-radius: 999px;
      padding: 0 18px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.15s var(--ease), box-shadow 0.15s var(--ease), background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active { transform: scale(0.97); }

    .btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .btn--primary {
      background: var(--stamp);
      color: #fff;
      box-shadow: 0 4px 16px rgba(196, 92, 74, 0.35);
    }

    .btn--primary:hover { background: #b55242; }

    .btn--ghost {
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--line-strong);
    }

    .btn--ghost:hover { background: #fff; }

    .btn--sm {
      min-height: 36px;
      padding: 0 14px;
      font-size: 13px;
    }

    .btn--chip {
      min-height: 34px;
      padding: 0 12px;
      font-size: 13px;
      border-radius: var(--radius-sm);
      background: var(--surface);
      border: 1px solid var(--line);
    }

    .btn--chip.is-active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    @media (max-width: 640px) {
      .summary-grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card__head {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .card__title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 400;
    }

    .card__tag {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-faint);
    }

    .card__body { padding: 14px 16px 16px; }

    .stat-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat {
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      background: var(--paper);
    }

    .stat__label {
      font-size: 11px;
      color: var(--ink-faint);
      margin-bottom: 2px;
    }

    .stat__value {
      font-family: var(--font-mono);
      font-size: 1.1rem;
      font-weight: 500;
    }

    .ratio-block {
      padding: 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      margin-bottom: 8px;
    }

    .ratio-block:last-child { margin-bottom: 0; }

    .ratio-block__head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .ratio-block__mode {
      font-size: 12px;
      color: var(--ink-soft);
    }

    .badge {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 999px;
    }

    .badge--pass { background: rgba(45, 138, 78, 0.14); color: var(--pass); }
    .badge--fail { background: rgba(184, 74, 58, 0.12); color: var(--fail); }

    .ratio-bar {
      height: 8px;
      border-radius: 999px;
      background: var(--paper-deep);
      overflow: hidden;
      position: relative;
    }

    .ratio-bar__fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--ok));
      transition: width 0.4s var(--ease);
    }

    .ratio-bar__mark {
      position: absolute;
      top: -3px;
      bottom: -3px;
      width: 2px;
      background: var(--stamp);
      left: 40%;
      opacity: 0.7;
    }

    .ratio-block__nums {
      margin-top: 6px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--ink-soft);
    }

    .mini-cal {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
      margin-top: 10px;
    }

    .mini-cal__wd {
      text-align: center;
      font-size: 10px;
      color: var(--ink-faint);
      padding: 2px 0;
    }

    .mini-cal__cell {
      aspect-ratio: 1;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 9px;
      display: grid;
      place-items: center;
      color: var(--ink-faint);
    }

    .mini-cal__cell.is-empty { visibility: hidden; }
    .mini-cal__cell.is-weekend { background: var(--weekend); }
    .mini-cal__cell.is-full { background: var(--ok-soft); color: var(--ok); font-weight: 500; }
    .mini-cal__cell.is-half { background: var(--half-soft); color: var(--half); font-weight: 500; }
    .mini-cal__cell.is-holiday { background: var(--holiday-soft); color: var(--holiday); }
    .mini-cal__cell.is-leave { background: var(--leave-soft); color: var(--leave); }

    .main-panel .card__body { padding-top: 12px; }

    .cal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .cal-nav__label {
      font-family: var(--font-display);
      font-size: 1.35rem;
    }

    .cal {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .cal__wd {
      text-align: center;
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-faint);
      padding: 4px 0 8px;
    }

    .cal__cell {
      aspect-ratio: 1;
      min-height: 44px;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      background: transparent;
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--ink);
      display: grid;
      place-items: center;
      position: relative;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .cal__cell:hover:not(:disabled) { background: var(--paper); }

    .cal__cell:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .cal__cell:disabled {
      cursor: default;
      visibility: hidden;
    }

    .cal__cell.is-today::after {
      content: "";
      position: absolute;
      bottom: 5px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--stamp);
    }

    .cal__cell.is-weekend { color: var(--ink-faint); background: var(--weekend); }
    .cal__cell.is-full { background: var(--ok-soft); color: var(--ok); font-weight: 600; }
    .cal__cell.is-half { background: var(--half-soft); color: var(--half); font-weight: 600; }
    .cal__cell.is-holiday { background: var(--holiday-soft); color: var(--holiday); }
    .cal__cell.is-leave { background: var(--leave-soft); color: var(--leave); }
    .cal__cell.is-selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
      transform: scale(1.04);
      z-index: 1;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .legend__item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--ink-soft);
    }

    .legend__swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .action-panel {
      margin-top: 14px;
      padding: 14px;
      border-radius: var(--radius-sm);
      background: var(--paper);
      border: 1px solid var(--line);
      display: grid;
      gap: 12px;
    }

    .action-panel[hidden] { display: none; }

    .action-panel__date {
      font-family: var(--font-display);
      font-size: 1.1rem;
    }

    .action-panel__hint {
      font-size: 13px;
      color: var(--ink-soft);
      margin: -4px 0 0;
    }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    @media (max-width: 480px) {
      .action-grid { grid-template-columns: 1fr; }
    }

    .action-grid .btn { width: 100%; border-radius: var(--radius-sm); }

    .action-panel__footer {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      padding-top: 4px;
      border-top: 1px dashed var(--line);
    }

    .pending-hint {
      font-size: 12px;
      color: var(--accent);
      font-weight: 500;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + var(--safe-bottom));
      transform: translateX(-50%) translateY(16px);
      padding: 10px 18px;
      border-radius: 999px;
      background: var(--ink);
      color: #fff;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s var(--ease);
      z-index: 100;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .stamp-flash {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      z-index: 99;
      opacity: 0;
    }

    .stamp-flash.is-visible {
      animation: stamp-pop 0.55s var(--ease) forwards;
    }

    .stamp-flash__inner {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 12vw, 4rem);
      color: var(--stamp);
      border: 4px solid var(--stamp);
      border-radius: 12px;
      padding: 12px 28px;
      transform: rotate(-8deg);
      opacity: 0.9;
    }

    @keyframes stamp-pop {
      0% { opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .stamp-flash.is-visible { animation: none; opacity: 0; }
      .ratio-bar__fill, .cal__cell, .btn, .toast { transition: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="hero">
      <p class="hero__eyebrow">Attendance Ledger</p>
      <h1 class="hero__title">打卡</h1>
      <p class="hero__sub">记录出勤、标记放假与请假，自动计算当月与上月是否达到 40% 工作日出勤率。</p>
    </header>

    <div class="quick-bar">
      <button type="button" class="btn btn--primary" id="btnToday">今日打卡（全天）</button>
      <button type="button" class="btn btn--ghost btn--sm" id="btnExport">导出数据</button>
      <label class="btn btn--ghost btn--sm" style="cursor:pointer">
        导入数据
        <input type="file" id="importFile" accept="application/json" hidden>
      </label>
    </div>

    <div class="summary-grid" id="summaryGrid"></div>

    <section class="card main-panel">
      <div class="card__head">
        <h2 class="card__title">日历</h2>
        <span class="card__tag" id="viewMonthTag"></span>
      </div>
      <div class="card__body">
        <div class="cal-nav">
          <button type="button" class="btn btn--ghost btn--sm" id="btnPrev" aria-label="上个月">←</button>
          <span class="cal-nav__label" id="calLabel"></span>
          <button type="button" class="btn btn--ghost btn--sm" id="btnNext" aria-label="下个月">→</button>
        </div>
        <div class="cal" id="calWeekdays"></div>
        <div class="cal" id="calGrid" role="grid" aria-label="打卡日历"></div>
        <div class="legend" id="legend"></div>

        <div class="action-panel" id="actionPanel" hidden>
          <div class="action-panel__date" id="selectedDateLabel"></div>
          <p class="action-panel__hint" id="selectedDateMeta"></p>
          <div class="action-grid" id="actionChoices"></div>
          <div class="action-panel__footer">
            <span class="pending-hint" id="pendingHint" hidden>已选择操作，请确认</span>
            <div style="display:flex;gap:8px;margin-left:auto">
              <button type="button" class="btn btn--ghost btn--sm" id="btnCancelAction">取消</button>
              <button type="button" class="btn btn--primary btn--sm" id="btnConfirm" disabled>确认</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="stamp-flash" id="stampFlash" aria-hidden="true">
    <div class="stamp-flash__inner">已打卡</div>
  </div>

  <script>
    (function () {
      "use strict";

      var STORAGE_KEY = "daka-data-v1";
      var THRESHOLD = 0.4;
      var WEEKDAYS = ["日", "一", "二", "三", "四", "五", "六"];

      var state = {
        data: loadData(),
        viewYear: 0,
        viewMonth: 0,
        selectedKey: null,
        pendingAction: null
      };

      var today = new Date();
      state.viewYear = today.getFullYear();
      state.viewMonth = today.getMonth() + 1;

      function pad(n) { return n < 10 ? "0" + n : String(n); }

      function dateKey(y, m, d) {
        return y + "-" + pad(m) + "-" + pad(d);
      }

      function parseKey(key) {
        var p = key.split("-");
        return new Date(+p[0], +p[1] - 1, +p[2]);
      }

      function isWeekend(date) {
        var w = date.getDay();
        return w === 0 || w === 6;
      }

      function loadData() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            var parsed = JSON.parse(raw);
            return {
              checkins: parsed.checkins || {},
              holidays: parsed.holidays || [],
              onleave: parsed.onleave || {}
            };
          }
        } catch (e) { /* ignore */ }
        return { checkins: {}, holidays: [], onleave: {} };
      }

      function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
      }

      function isHoliday(key) {
        return state.data.holidays.indexOf(key) !== -1;
      }

      function isOnLeave(key) {
        return !!state.data.onleave[key];
      }

      function getCheckin(key) {
        return state.data.checkins[key] || null;
      }

      /** Work-day weight for denominator (0, 0.5, or 1). */
      function workDayWeight(key) {
        var date = parseKey(key);
        if (isWeekend(date)) return 0;
        if (isHoliday(key)) return 0;
        if (isOnLeave(key)) return 0.5;
        return 1;
      }

      /** Check-in weight for numerator. halfAsFull: half counts as 1, else 0.5 */
      function checkinWeight(key, halfAsFull) {
        var c = getCheckin(key);
        if (c === "full") return 1;
        if (c === "half") return halfAsFull ? 1 : 0.5;
        return 0;
      }

      function monthStats(year, month) {
        var days = new Date(year, month, 0).getDate();
        var workFull = 0;
        var workHalfMode = 0;
        var checkFullMode = 0;
        var checkHalfMode = 0;
        var checkedDays = 0;

        for (var d = 1; d <= days; d++) {
          var key = dateKey(year, month, d);
          var w = workDayWeight(key);
          workFull += w;
          workHalfMode += w;
          checkFullMode += checkinWeight(key, true);
          checkHalfMode += checkinWeight(key, false);
          if (getCheckin(key)) checkedDays++;
        }

        return {
          workDays: workFull,
          checkFullMode: checkFullMode,
          checkHalfMode: checkHalfMode,
          checkedDays: checkedDays,
          ratioFull: workFull > 0 ? checkFullMode / workFull : 0,
          ratioHalf: workFull > 0 ? checkHalfMode / workFull : 0
        };
      }

      function formatMonth(year, month) {
        return year + "年" + month + "月";
      }

      function formatDateLabel(key) {
        var date = parseKey(key);
        return date.getFullYear() + "年" + (date.getMonth() + 1) + "月" + date.getDate() + "日 周" + WEEKDAYS[date.getDay()];
      }

      function dayMeta(key) {
        var parts = [];
        var date = parseKey(key);
        if (isWeekend(date)) parts.push("双休日");
        if (isHoliday(key)) parts.push("放假日");
        if (isOnLeave(key)) parts.push("请假（半天）");
        var c = getCheckin(key);
        if (c === "full") parts.push("已打卡·全天");
        if (c === "half") parts.push("已打卡·半天");
        if (!parts.length) parts.push("工作日");
        return parts.join(" · ");
      }

      function showToast(msg) {
        var el = document.getElementById("toast");
        el.textContent = msg;
        el.classList.add("is-visible");
        clearTimeout(showToast._t);
        showToast._t = setTimeout(function () { el.classList.remove("is-visible"); }, 2200);
      }

      function showStamp() {
        var el = document.getElementById("stampFlash");
        el.classList.remove("is-visible");
        void el.offsetWidth;
        el.classList.add("is-visible");
        setTimeout(function () { el.classList.remove("is-visible"); }, 600);
      }

      function renderSummary() {
        var grid = document.getElementById("summaryGrid");
        var now = new Date();
        var cy = now.getFullYear();
        var cm = now.getMonth() + 1;
        var ly = cm === 1 ? cy - 1 : cy;
        var lm = cm === 1 ? 12 : cm - 1;
        var months = [
          { year: cy, month: cm, label: "本月" },
          { year: ly, month: lm, label: "上月" }
        ];

        grid.innerHTML = months.map(function (m) {
          var s = monthStats(m.year, m.month);
          return buildSummaryCard(m.label, m.year, m.month, s);
        }).join("");
      }

      function buildSummaryCard(label, year, month, s) {
        function ratioBlock(modeLabel, ratio, checkVal) {
          var pass = ratio >= THRESHOLD;
          var pct = Math.round(ratio * 1000) / 10;
          return (
            '<div class="ratio-block">' +
              '<div class="ratio-block__head">' +
                '<span class="ratio-block__mode">' + modeLabel + '</span>' +
                '<span class="badge ' + (pass ? "badge--pass" : "badge--fail") + '">' +
                  (pass ? "≥40%" : "<40%") +
                '</span>' +
              '</div>' +
              '<div class="ratio-bar">' +
                '<div class="ratio-bar__fill" style="width:' + Math.min(100, pct) + '%"></div>' +
                '<div class="ratio-bar__mark" title="40% 阈值"></div>' +
              '</div>' +
              '<div class="ratio-block__nums">' +
                checkVal + ' / ' + s.workDays + ' 工作日 = ' + pct + '%' +
              '</div>' +
            '</div>'
          );
        }

        var mini = buildMiniCal(year, month);

        return (
          '<article class="card">' +
            '<div class="card__head">' +
              '<h2 class="card__title">' + label + ' · ' + formatMonth(year, month) + '</h2>' +
              '<span class="card__tag">' + s.checkedDays + ' 天有记录</span>' +
            '</div>' +
            '<div class="card__body">' +
              '<div class="stat-row">' +
                '<div class="stat"><div class="stat__label">工作日总量</div><div class="stat__value">' + s.workDays + '</div></div>' +
                '<div class="stat"><div class="stat__label">有打卡记录</div><div class="stat__value">' + s.checkedDays + ' 天</div></div>' +
              '</div>' +
              ratioBlock("半天按一天算", s.ratioFull, s.checkFullMode) +
              ratioBlock("半天按半天算", s.ratioHalf, s.checkHalfMode) +
              mini +
            '</div>' +
          '</article>'
        );
      }

      function cellClass(key) {
        var date = parseKey(key);
        var c = getCheckin(key);
        if (c === "full") return "is-full";
        if (c === "half") return "is-half";
        if (isOnLeave(key)) return "is-leave";
        if (isHoliday(key)) return "is-holiday";
        if (isWeekend(date)) return "is-weekend";
        return "";
      }

      function buildMiniCal(year, month) {
        var days = new Date(year, month, 0).getDate();
        var firstWd = new Date(year, month - 1, 1).getDay();
        var html = '<div class="mini-cal">';
        WEEKDAYS.forEach(function (w) {
          html += '<div class="mini-cal__wd">' + w + '</div>';
        });
        for (var i = 0; i < firstWd; i++) {
          html += '<div class="mini-cal__cell is-empty"></div>';
        }
        for (var d = 1; d <= days; d++) {
          var key = dateKey(year, month, d);
          html += '<div class="mini-cal__cell ' + cellClass(key) + '" title="' + d + '">' + d + '</div>';
        }
        html += '</div>';
        return html;
      }

      function renderCalendar() {
        var y = state.viewYear;
        var m = state.viewMonth;
        document.getElementById("calLabel").textContent = formatMonth(y, m);
        document.getElementById("viewMonthTag").textContent = y + "-" + pad(m);

        var wdEl = document.getElementById("calWeekdays");
        wdEl.innerHTML = WEEKDAYS.map(function (w) {
          return '<div class="cal__wd" role="columnheader">' + w + '</div>';
        }).join("");

        var days = new Date(y, m, 0).getDate();
        var firstWd = new Date(y, m - 1, 1).getDay();
        var grid = document.getElementById("calGrid");
        var html = "";
        var todayKey = dateKey(today.getFullYear(), today.getMonth() + 1, today.getDate());

        for (var i = 0; i < firstWd; i++) {
          html += '<button type="button" class="cal__cell" disabled></button>';
        }
        for (var d = 1; d <= days; d++) {
          var key = dateKey(y, m, d);
          var cls = ["cal__cell", cellClass(key)];
          if (key === todayKey) cls.push("is-today");
          if (key === state.selectedKey) cls.push("is-selected");
          html += '<button type="button" class="' + cls.join(" ") + '" data-key="' + key + '" aria-label="' + formatDateLabel(key) + '">' + d + '</button>';
        }
        grid.innerHTML = html;

        grid.querySelectorAll(".cal__cell[data-key]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            selectDate(btn.getAttribute("data-key"));
          });
        });

        renderLegend();
        renderActionPanel();
      }

      function renderLegend() {
        var items = [
          { cls: "is-full", label: "全天打卡" },
          { cls: "is-half", label: "半天打卡" },
          { cls: "is-holiday", label: "放假日" },
          { cls: "is-leave", label: "请假（半天）" },
          { cls: "is-weekend", label: "双休日" }
        ];
        var swatchBg = {
          "is-full": "var(--ok-soft)",
          "is-half": "var(--half-soft)",
          "is-holiday": "var(--holiday-soft)",
          "is-leave": "var(--leave-soft)",
          "is-weekend": "var(--weekend)"
        };
        document.getElementById("legend").innerHTML = items.map(function (it) {
          return '<span class="legend__item"><span class="legend__swatch" style="background:' + swatchBg[it.cls] + '"></span>' + it.label + '</span>';
        }).join("");
      }

      var ACTIONS = [
        { id: "checkin-full", label: "全天打卡", desc: "记录全天出勤" },
        { id: "checkin-half", label: "半天打卡", desc: "记录半天出勤" },
        { id: "holiday-toggle", label: "标记/取消放假", desc: "工作日设为放假日" },
        { id: "leave-toggle", label: "标记/取消请假", desc: "半天请假，工作日减 0.5" },
        { id: "clear-checkin", label: "清除打卡", desc: "移除该日打卡记录" }
      ];

      function selectDate(key) {
        state.selectedKey = key;
        state.pendingAction = null;
        renderCalendar();
      }

      function renderActionPanel() {
        var panel = document.getElementById("actionPanel");
        if (!state.selectedKey) {
          panel.hidden = true;
          return;
        }
        panel.hidden = false;
        document.getElementById("selectedDateLabel").textContent = formatDateLabel(state.selectedKey);
        document.getElementById("selectedDateMeta").textContent = dayMeta(state.selectedKey);

        var choices = document.getElementById("actionChoices");
        choices.innerHTML = ACTIONS.map(function (a) {
          var active = state.pendingAction === a.id ? " is-active" : "";
          return '<button type="button" class="btn btn--chip' + active + '" data-action="' + a.id + '">' + a.label + '</button>';
        }).join("");

        choices.querySelectorAll("[data-action]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            state.pendingAction = btn.getAttribute("data-action");
            document.getElementById("btnConfirm").disabled = false;
            document.getElementById("pendingHint").hidden = false;
            renderActionPanel();
          });
        });

        document.getElementById("btnConfirm").disabled = !state.pendingAction;
        document.getElementById("pendingHint").hidden = !state.pendingAction;
      }

      function applyAction(key, action) {
        var date = parseKey(key);

        if (action === "checkin-full") {
          state.data.checkins[key] = "full";
        } else if (action === "checkin-half") {
          state.data.checkins[key] = "half";
        } else if (action === "clear-checkin") {
          delete state.data.checkins[key];
        } else if (action === "holiday-toggle") {
          if (isWeekend(date)) {
            showToast("双休日已默认放假，无需标记");
            return false;
          }
          var hi = state.data.holidays.indexOf(key);
          if (hi === -1) state.data.holidays.push(key);
          else state.data.holidays.splice(hi, 1);
        } else if (action === "leave-toggle") {
          if (isWeekend(date) || isHoliday(key)) {
            showToast("只能在工作日标记请假");
            return false;
          }
          if (isOnLeave(key)) delete state.data.onleave[key];
          else state.data.onleave[key] = "half";
        }
        saveData();
        return true;
      }

      function confirmAction() {
        if (!state.selectedKey || !state.pendingAction) return;
        var ok = applyAction(state.selectedKey, state.pendingAction);
        if (!ok) return;
        var action = state.pendingAction;
        state.pendingAction = null;
        if (action === "checkin-full" || action === "checkin-half") showStamp();
        showToast("已保存");
        renderSummary();
        renderCalendar();
      }

      function checkinToday(full) {
        var key = dateKey(today.getFullYear(), today.getMonth() + 1, today.getDate());
        state.data.checkins[key] = full ? "full" : "half";
        saveData();
        showStamp();
        showToast("今日已打卡");
        state.viewYear = today.getFullYear();
        state.viewMonth = today.getMonth() + 1;
        state.selectedKey = key;
        renderSummary();
        renderCalendar();
      }

      document.getElementById("btnToday").addEventListener("click", function () {
        checkinToday(true);
      });

      document.getElementById("btnConfirm").addEventListener("click", confirmAction);

      document.getElementById("btnCancelAction").addEventListener("click", function () {
        state.pendingAction = null;
        state.selectedKey = null;
        renderCalendar();
      });

      document.getElementById("btnPrev").addEventListener("click", function () {
        state.viewMonth--;
        if (state.viewMonth < 1) { state.viewMonth = 12; state.viewYear--; }
        renderCalendar();
      });

      document.getElementById("btnNext").addEventListener("click", function () {
        state.viewMonth++;
        if (state.viewMonth > 12) { state.viewMonth = 1; state.viewYear++; }
        renderCalendar();
      });

      document.getElementById("btnExport").addEventListener("click", function () {
        var blob = new Blob([JSON.stringify(state.data, null, 2)], { type: "application/json" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "daka-backup-" + dateKey(today.getFullYear(), today.getMonth() + 1, today.getDate()) + ".json";
        a.click();
        URL.revokeObjectURL(a.href);
        showToast("已导出");
      });

      document.getElementById("importFile").addEventListener("change", function (e) {
        var file = e.target.files && e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          try {
            var parsed = JSON.parse(reader.result);
            state.data = {
              checkins: parsed.checkins || {},
              holidays: parsed.holidays || [],
              onleave: parsed.onleave || {}
            };
            saveData();
            renderSummary();
            renderCalendar();
            showToast("导入成功");
          } catch (err) {
            showToast("导入失败：文件格式错误");
          }
        };
        reader.readAsText(file);
        e.target.value = "";
      });

      renderSummary();
      renderCalendar();
    })();
  </script>
</body>
</html>
