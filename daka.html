---
permalink: /daka/
---
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>打卡</title>
  <meta name="description" content="工作日打卡记录与出勤统计">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1a2332;
      --ink-soft: rgba(26, 35, 50, 0.72);
      --ink-faint: rgba(26, 35, 50, 0.45);
      --paper: #f5f0e8;
      --paper-deep: #ebe4d8;
      --surface: #fffcf7;
      --line: rgba(26, 35, 50, 0.1);
      --line-strong: rgba(26, 35, 50, 0.18);
      --stamp: #dc2626;
      --checkin: #16a34a;
      --checkin-dark: #15803d;
      --checkin-soft: rgba(22, 163, 74, 0.22);
      --ok: var(--checkin);
      --ok-soft: var(--checkin-soft);
      --half: var(--checkin);
      --half-soft: var(--checkin-soft);
      --leave: #7c3aed;
      --leave-soft: rgba(124, 58, 237, 0.2);
      --holiday: #be123c;
      --holiday-soft: rgba(190, 18, 60, 0.18);
      --weekend: #e2e8f0;
      --accent: #2a6f97;
      --accent-soft: rgba(42, 111, 151, 0.12);
      --pass: #2d8a4e;
      --fail: #b84a3a;
      --font-display: "DM Serif Display", "Songti SC", serif;
      --font-sans: "IBM Plex Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
      --radius: 14px;
      --radius-sm: 8px;
      --shadow: 0 12px 40px rgba(26, 35, 50, 0.08);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --sheet-h: 0px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { color-scheme: light; overflow-x: clip; }

    body {
      margin: 0;
      min-height: 100dvh;
      max-width: 100%;
      overflow-x: clip;
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.5;
      color: var(--ink);
      background: linear-gradient(180deg, var(--paper) 0%, #efe9df 100%);
      padding: calc(16px + var(--safe-top)) 14px calc(16px + var(--safe-bottom));
      padding-bottom: calc(16px + var(--safe-bottom) + var(--sheet-h));
    }

    body.sheet-open { --sheet-h: 320px; }

    .app {
      max-width: 960px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
      min-width: 0;
      width: 100%;
    }

    .hero { display: grid; gap: 6px; }
    .hero__title {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      font-weight: 400;
    }
    .hero__sub { margin: 0; color: var(--ink-soft); font-size: 14px; }

    .guide {
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      background: var(--accent-soft);
      border: 1px solid rgba(42, 111, 151, 0.2);
      font-size: 13px;
      color: var(--ink-soft);
      line-height: 1.55;
    }
    .guide strong { color: var(--ink); font-weight: 600; }

    .quick-bar { display: flex; flex-wrap: wrap; gap: 8px; }

    .btn {
      appearance: none;
      border: none;
      cursor: pointer;
      font: inherit;
      font-weight: 500;
      border-radius: 999px;
      padding: 0 16px;
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.12s, background 0.12s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .btn:active { transform: scale(0.97); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn--primary { background: var(--checkin-dark); color: #fff; }
    .btn--half { background: var(--surface); color: var(--checkin-dark); border: 2px solid var(--checkin); }
    .btn--ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); }
    .btn--sm { min-height: 34px; padding: 0 12px; font-size: 13px; }
    .btn--block { width: 100%; border-radius: var(--radius-sm); min-height: 44px; }
    .btn--chip {
      min-height: 40px;
      padding: 0 12px;
      font-size: 14px;
      border-radius: var(--radius-sm);
      background: var(--surface);
      border: 1px solid var(--line);
      width: 100%;
    }
    .btn--chip.is-active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }
    .btn--chip.is-on-holiday {
      background: var(--holiday-soft);
      border-color: var(--holiday);
      color: var(--holiday);
    }
    .btn--chip.is-on-leave {
      background: var(--leave-soft);
      border-color: var(--leave);
      color: var(--leave);
    }
    .btn--chip.is-on-checkin,
    .btn--chip.is-on-half-checkin {
      background: var(--checkin-soft);
      border-color: var(--checkin);
      color: var(--checkin-dark);
    }

    .view-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      background: var(--surface);
      border: 1px solid var(--line);
    }
    .view-bar__left { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .view-bar__nav { display: flex; gap: 4px; align-items: center; }
    .view-bar__label {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      min-width: 7rem;
      text-align: center;
    }
    .btn.is-on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }

    .month-grid--triple { grid-template-columns: 1fr; }

    .merged-cal-pane { padding: 14px 0 0; min-width: 0; }
    .merged-cal-pane__title {
      margin: 0 0 10px;
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 400;
    }
    .merged-cal-pane__hint {
      font-size: 11px;
      color: var(--ink-faint);
      margin: 0 0 10px;
    }
    .cal__cell.is-curr-month { color: var(--ink); font-weight: 700; }
    .cal__cell.is-adj-month {
      color: var(--ink-faint);
      opacity: 0.72;
    }
    .cal__cell.is-adj-month.is-full,
    .cal__cell.is-adj-month.is-half,
    .cal__cell.is-adj-month.is-holiday,
    .cal__cell.is-adj-month.is-leave { opacity: 0.82; }
    .cal__month-band {
      grid-column: 1 / -1;
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-soft);
      padding: 8px 0 2px;
      border-top: 1px dashed var(--line);
      margin-top: 4px;
    }
    .cal__month-band:first-child { border-top: none; margin-top: 0; padding-top: 0; }
    .cal__month-band--curr { color: var(--ink); }

    .period-dashboard {
      display: grid;
      gap: 12px;
    }
    .period-dashboard__head {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }
    .period-dashboard__mode {
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-faint);
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--paper);
      border: 1px solid var(--line);
    }
    .period-dashboard__title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 400;
    }
    .mode-toggle { display: flex; gap: 4px; }
    .mode-toggle .btn--sm { border-radius: var(--radius-sm); }

    .alert {
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      line-height: 1.45;
    }
    .alert--ok { background: rgba(45, 138, 78, 0.12); border: 1px solid rgba(45, 138, 78, 0.25); color: var(--pass); }
    .alert--warn { background: rgba(234, 88, 12, 0.12); border: 1px solid rgba(234, 88, 12, 0.3); color: #c2410c; }
    .alert--fail { background: rgba(220, 38, 38, 0.1); border: 2px solid rgba(220, 38, 38, 0.45); color: #b91c1c; font-weight: 500; }
    .alert strong { font-weight: 700; }

    .timeline-scroll { max-width: 100%; min-width: 0; }

    .period-chip--warn {
      background: rgba(234, 88, 12, 0.14);
      border-color: rgba(234, 88, 12, 0.45);
      color: #c2410c;
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 2px;
    }
    .period-chip--critical {
      background: #dc2626;
      border-color: #dc2626;
      color: #fff;
      font-weight: 700;
      text-decoration: underline;
      text-decoration-style: double;
      text-decoration-thickness: 3px;
      text-underline-offset: 3px;
    }

    .period-matrix { display: grid; gap: 5px; }
    .period-matrix__row {
      display: grid;
      grid-template-columns: 4.5rem 1fr;
      gap: 8px;
      align-items: start;
      font-size: 11px;
    }
    .period-matrix__label {
      font-family: var(--font-mono);
      font-weight: 600;
      color: var(--ink);
      padding-top: 3px;
    }
    .period-chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .period-chip {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(220, 38, 38, 0.12);
      border: 1px solid rgba(220, 38, 38, 0.35);
      color: #b91c1c;
      font-weight: 600;
    }
    .period-chip--ok {
      background: rgba(45, 138, 78, 0.1);
      border-color: rgba(45, 138, 78, 0.25);
      color: var(--pass);
      font-weight: 500;
    }

    .month-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      align-items: start;
    }
    @media (max-width: 720px) { .month-grid { grid-template-columns: 1fr; } }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .card__head {
      padding: 12px 14px 8px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .card__title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 400;
    }
    .card__nav { display: flex; gap: 4px; }
    .month-nav {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 3px;
      border-radius: 999px;
      background: var(--paper);
      border: 1px solid var(--line-strong);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }
    .month-nav__btn {
      appearance: none;
      border: none;
      cursor: pointer;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 1.15rem;
      line-height: 1;
      color: var(--ink-soft);
      background: transparent;
      transition: background 0.12s, color 0.12s, transform 0.12s;
      -webkit-tap-highlight-color: transparent;
    }
    .month-nav__btn:hover {
      background: var(--surface);
      color: var(--accent);
    }
    .month-nav__btn:active { transform: scale(0.94); }
    .month-nav__btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    .month-nav__label {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      padding: 0 12px;
      min-width: 7.5rem;
      text-align: center;
      white-space: nowrap;
    }
    .card__body { padding: 12px 14px 14px; }

    .stat-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .stat {
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      background: var(--paper);
    }
    .stat__label { font-size: 11px; color: var(--ink-faint); }
    .stat__value { font-family: var(--font-mono); font-size: 1rem; font-weight: 500; }

    .ratio-block {
      padding: 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      margin-bottom: 6px;
      font-size: 12px;
    }
    .ratio-block__row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      color: var(--ink-soft);
    }
    .badge {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 999px;
      font-weight: 500;
    }
    .badge--pass { background: rgba(45, 138, 78, 0.14); color: var(--pass); }
    .badge--fail { background: rgba(184, 74, 58, 0.12); color: var(--fail); }
    .ratio-bar {
      height: 6px;
      border-radius: 999px;
      background: var(--paper-deep);
      overflow: hidden;
      position: relative;
    }
    .ratio-bar__fill {
      height: 100%;
      background: linear-gradient(90deg, var(--checkin-dark), var(--checkin));
      transition: width 0.35s var(--ease);
    }
    .ratio-bar__mark {
      position: absolute;
      top: -2px; bottom: -2px;
      width: 2px;
      background: var(--stamp);
      left: 40%;
      opacity: 0.75;
    }

    .week-block {
      padding: 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      margin-bottom: 6px;
      font-size: 12px;
    }
    .week-block__title {
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 4px;
      font-size: 12px;
    }
    .week-block__sub {
      font-size: 10px;
      color: var(--ink-faint);
      margin-bottom: 8px;
    }
    .week-rows { display: grid; gap: 4px; margin-bottom: 8px; }
    .week-row {
      display: grid;
      grid-template-columns: minmax(4.6rem, 5.4rem) 1fr auto;
      gap: 6px;
      align-items: center;
      font-size: 11px;
      color: var(--ink-soft);
    }
    .week-row__label {
      font-family: var(--font-mono);
      font-weight: 600;
      color: var(--ink);
      font-size: 10px;
      line-height: 1.2;
    }
    .week-row__bar {
      height: 5px;
      border-radius: 999px;
      background: var(--paper-deep);
      overflow: hidden;
    }
    .week-row__fill {
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
    }
    .week-row__fill.is-fail { background: var(--fail); }
    .week-row__fill.is-pass { background: var(--pass); }
    .week-streak {
      padding-top: 8px;
      border-top: 1px dashed var(--line);
      color: var(--ink-soft);
      line-height: 1.5;
    }
    .week-streak strong { color: var(--fail); font-weight: 600; }
    .week-streak--ok { color: var(--pass); }
    .week-streak--ok strong { color: var(--pass); }

    .period-lines { display: grid; gap: 6px; }
    .period-line { font-size: 11px; line-height: 1.5; color: var(--ink-soft); }
    .period-line strong { color: var(--ink); font-weight: 600; }
    .period-line--ok { color: var(--pass); }
    .week-block--period { margin-top: 6px; }

    .main-panel { overflow: hidden; min-width: 0; }
    .main-panel__head { flex-wrap: wrap; gap: 8px; }
    .main-panel__toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
    }
    .mode-switch {
      display: inline-flex;
      padding: 3px;
      border-radius: 999px;
      background: var(--paper);
      border: 1px solid var(--line-strong);
      gap: 2px;
    }
    .mode-switch .btn--sm {
      min-height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      border: none;
      background: transparent;
    }
    .mode-switch .btn--sm.is-on {
      background: var(--surface);
      box-shadow: 0 1px 3px rgba(26, 35, 50, 0.12);
    }
    .month-stats-footer {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }
    .month-stats-footer__title {
      margin: 0 0 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-soft);
    }
    .main-panel__body { display: grid; gap: 0; min-width: 0; overflow: hidden; }
    .period-section {
      padding-top: 14px;
      margin-top: 0;
      border-top: 1px solid var(--line);
    }
    .period-stack {
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: var(--paper);
    }
    .period-matrix--strip {
      display: grid;
      gap: 0;
      margin-top: 0;
    }
    .period-matrix--strip .period-matrix__row {
      grid-template-columns: 4.2rem 1fr;
      align-items: center;
      padding: 8px 10px;
      border-radius: 0;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--line);
    }
    .period-matrix--strip .period-matrix__row:last-child {
      border-bottom: none;
    }
    .period-week-block {
      padding: 10px;
      border-top: 1px solid var(--line);
      background: var(--surface);
    }
    .month-layer {
      position: relative;
      z-index: 2;
      padding: 0;
      min-width: 0;
    }
    .month-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }
    @media (max-width: 520px) { .month-strip { grid-template-columns: 1fr; } }
    .month-strip__card {
      padding: 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--paper);
      min-width: 0;
    }
    .month-strip__card--curr {
      border-color: var(--accent);
      background: var(--surface);
      box-shadow: 0 0 0 1px rgba(42, 111, 151, 0.12);
    }
    .month-strip__label {
      font-size: 10px;
      font-weight: 600;
      color: var(--ink-faint);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .month-strip__name {
      font-family: var(--font-display);
      font-size: 0.95rem;
      margin: 2px 0 6px;
    }
    .month-strip__card--curr .month-strip__name { color: var(--ink); font-weight: 600; }
    .month-strip__card:not(.month-strip__card--curr) .month-strip__name { color: var(--ink-soft); }
    .month-strip__meta {
      font-size: 11px;
      color: var(--ink-soft);
      line-height: 1.4;
    }
    .month-strip__pct {
      font-family: var(--font-mono);
      font-size: 1.1rem;
      font-weight: 600;
      margin-top: 4px;
    }
    .month-strip__pct.is-pass { color: var(--pass); }
    .month-strip__pct.is-fail { color: var(--fail); }
    .fail-report__title {
      margin: 0 0 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-faint);
      letter-spacing: 0.02em;
    }
    .fail-report__hint {
      margin: 0 0 12px;
      font-size: 10px;
      color: var(--ink-soft);
      line-height: 1.45;
    }
    .fail-report__hint strong { color: var(--ink); font-weight: 600; }
    .fail-report__empty {
      margin: 0;
      padding: 14px 12px;
      border-radius: 6px;
      border: 1px dashed var(--line);
      background: var(--paper);
      font-size: 11px;
      color: var(--pass);
      text-align: center;
    }
    .fail-report__group {
      margin-bottom: 14px;
    }
    .fail-report__group:last-child { margin-bottom: 0; }
    .fail-report__group-title {
      margin: 0 0 8px;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .fail-report__group--len-5 .fail-report__group-title { background: rgba(220, 38, 38, 0.1); color: #b91c1c; }
    .fail-report__group--len-4 .fail-report__group-title { background: rgba(234, 88, 12, 0.1); color: #c2410c; }
    .fail-report__group--len-3 .fail-report__group-title { background: rgba(217, 119, 6, 0.1); color: #b45309; }
    .fail-report__group--len-2 .fail-report__group-title { background: rgba(251, 146, 60, 0.12); color: #ea580c; }
    .fail-report__group--len-1 .fail-report__group-title { background: rgba(225, 29, 72, 0.08); color: #be123c; }
    .fail-report__count {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      opacity: 0.85;
    }
    .fail-report__items {
      display: grid;
      gap: 8px;
    }
    .fail-window {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      overflow: hidden;
    }
    .fail-window--len-5 { border-left: 3px solid #dc2626; }
    .fail-window--len-4 { border-left: 3px solid #ea580c; }
    .fail-window--len-3 { border-left: 3px solid #d97706; }
    .fail-window--len-2 { border-left: 3px solid #fb923c; }
    .fail-window--len-1 { border-left: 3px solid #e11d48; }
    .fail-window__head {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
      font-size: 11px;
    }
    .fail-window__num {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      width: 1.4rem;
      height: 1.4rem;
      display: grid;
      place-items: center;
      border-radius: 4px;
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--ink-soft);
    }
    .fail-window__range {
      color: var(--ink-soft);
      line-height: 1.35;
      min-width: 0;
    }
    .fail-window__range strong {
      color: var(--ink);
      font-family: var(--font-mono);
      font-weight: 700;
    }
    .fail-window__total {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--fail);
      white-space: nowrap;
    }
    .fail-window__weeks {
      margin: 0;
      padding: 6px 10px 8px;
      list-style: none;
      display: grid;

    }
    .fail-window__week {
      display: grid;

    .fail-window__mark {

    .fail-window__pct {
      font-weight: 700;

    }
    .fail-window__pct.is-pass { color: var(--pass); }

    @media (max-width: 520px) {
      .fail-window__head {

    .month-pane {

    }
    .month-pane:last-child { border-bottom: none; padding-bottom: 0; }
    .month-pane__title {
      margin: 0 0 10px;
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 400;

    }
    .legend--inset {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .cal {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 4px;
      margin-top: 10px;

    }
    .cal__wd {
      text-align: center;

    }
    .cal__cell {
      aspect-ratio: 1;
      min-height: 36px;

    .cal__cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .cal__cell:disabled { visibility: hidden; pointer-events: none; }
    .cal__cell__num {

    .cal__cell.is-today .cal__cell__num::after {

      position: absolute;
      left: 50%;
      bottom: -5px;

    }
    .cal__cell.is-weekend { color: var(--ink-faint); background: var(--weekend); }
    .cal__cell.is-holiday { color: #fff; font-weight: 700; }
    .cal__cell.is-full { color: #fff; font-weight: 700; }
    .cal__cell.is-half { color: var(--checkin-dark); font-weight: 700; }
    .cal__cell.is-leave { color: var(--leave); font-weight: 700; }
    .cal__cell.is-holiday::before,
    .cal__cell.is-full::before,
    .cal__cell.is-half::before,
    .cal__cell.is-leave::before {
      content: "";
      position: absolute;
      left: 3px;
      top: 3px;
      bottom: 3px;

    }
    .cal__cell.is-holiday::before {

    }
    .cal__cell.is-full::before {

    .cal__cell.is-half::before {

    .cal__cell.is-selected {

    .legend {

      gap: 8px 12px;
      margin-top: 12px;

      border-top: 1px solid var(--line);

    .legend__item { display: flex; align-items: center; gap: 5px; }

    .legend__swatch--half {

    .legend__swatch--curr { background: var(--ink); }

    /* Fixed bottom sheet */

      position: fixed;

    body.sheet-open .toast { bottom: calc(var(--sheet-h) + 12px); }

    @media (max-width: 640px) {
      .axis-chart {
        grid-template-columns: minmax(3.8rem, 4.6rem) 1fr 2rem repeat(var(--marker-cols, 1), 7px);

    @media (prefers-reduced-motion: reduce) {
      .sheet, .sheet-backdrop, .ratio-bar__fill, .btn, .toast { transition: none; }

<body>
  <div class="app">
    <header class="hero">
      <h1 class="hero__title">打卡</h1>
      <p class="hero__sub">点击日历中的日期进行补打卡、半天打卡或标记放假/请假</p>
    </header>

    <div class="guide">
      <strong>怎么用：</strong>点日历补打卡。顶部<strong>一个月份切换</strong>控制双月/三月视图；双月显示上月+本月，三月以中月为准。
    </div>

    <div class="quick-bar">
      <button type="button" class="btn btn--primary" data-quick="full">今日全天打卡</button>
      <button type="button" class="btn btn--half" data-quick="half">今日半天打卡</button>
      <button type="button" class="btn btn--ghost btn--sm" data-action="export">导出</button>
      <label class="btn btn--ghost btn--sm" style="cursor:pointer">
        导入
        <input type="file" id="importFile" accept="application/json" hidden>
      </label>
    </div>

    <article class="card main-panel" id="mainPanel">
      <div class="card__head main-panel__head" id="mainPanelHead"></div>
      <div class="card__body main-panel__body">
        <div class="month-layer" id="monthLayer">
          <div class="month-grid" id="monthGrid"></div>
        </div>
        <div id="periodSection"></div>
        <div class="legend legend--inset" id="legend"></div>
      </div>
    </article>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop" aria-hidden="true"></div>
  <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetDate">
    <div class="sheet__handle"></div>
    <div class="sheet__date" id="sheetDate"></div>
    <p class="sheet__meta" id="sheetMeta"></p>

    <div class="sheet__section">
      <div class="sheet__label">打卡 / 补卡</div>
      <div class="sheet__grid" id="checkinActions"></div>
    </div>

    <div class="sheet__section">
      <div class="sheet__label">日期标记</div>
      <div class="sheet__grid" id="markActions"></div>
    </div>

    <div class="sheet__footer">
      <button type="button" class="btn btn--ghost" id="btnSheetClose">取消</button>
      <button type="button" class="btn btn--primary" id="btnSheetConfirm" disabled>确认</button>
    </div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      "use strict";

      var STORAGE_KEY = "daka-data-v1";
      var THRESHOLD = 0.4;
      var MAX_PERIOD = 5;
      var WEEKDAYS = ["日", "一", "二", "三", "四", "五", "六"];

      var CHECKIN_ACTIONS = [
        { id: "checkin-full", label: "全天打卡", hint: "计 1 天" },
        { id: "checkin-half", label: "半天打卡", hint: "特殊情况" },
        { id: "clear-checkin", label: "清除状态", hint: "移除当日所有标记" }
      ];

      var MARK_ACTIONS = [
        { id: "holiday-toggle", label: "放假日", hint: "工作日放假" },
        { id: "leave-toggle", label: "半天请假", hint: "工作日 -0.5" }
      ];

      var today = new Date();
      var state = {
        data: loadData(),
        selectedKey: null,
        pendingAction: null,
        tripleView: true,
        dashboardMode: "full",
        anchorYear: today.getFullYear(),
        anchorMonth: today.getMonth() + 1
      };

      function getDashboardMode() {
        var halfAsFull = state.dashboardMode === "full";
        return {
          halfAsFull: halfAsFull,
          label: halfAsFull ? "半天按一天算" : "半天按半天算",
          shortLabel: halfAsFull ? "半天按一天" : "半天按半天"
        };
      }

      function buildModeToggleHtml() {
        return (
          '<div class="mode-switch" role="group" aria-label="半天打卡计算方式">' +
            '<button type="button" class="btn btn--ghost btn--sm' + (state.dashboardMode === "full" ? " is-on" : "") + '" data-dashboard-mode="full">半天按一天</button>' +
            '<button type="button" class="btn btn--ghost btn--sm' + (state.dashboardMode === "half" ? " is-on" : "") + '" data-dashboard-mode="half">半天按半天</button>' +
          "</div>"
        );
      }

      function shiftYM(y, m, delta) {
        m += delta;
        while (m < 1) { m += 12; y--; }
        while (m > 12) { m -= 12; y++; }
        return { year: y, month: m };
      }

      function getDisplayMonths() {
        if (state.tripleView) {
          var prev = shiftYM(state.anchorYear, state.anchorMonth, -1);
          var next = shiftYM(state.anchorYear, state.anchorMonth, 1);
          return [
            { label: "前月", year: prev.year, month: prev.month },
            { label: "中月", year: state.anchorYear, month: state.anchorMonth },
            { label: "下月", year: next.year, month: next.month }
          ];
        }
        var prevDual = shiftYM(state.anchorYear, state.anchorMonth, -1);
        return [
          { label: "上月", year: prevDual.year, month: prevDual.month },
          { label: "本月", year: state.anchorYear, month: state.anchorMonth }
        ];
      }

      function pad(n) { return n < 10 ? "0" + n : String(n); }
      function dateKey(y, m, d) { return y + "-" + pad(m) + "-" + pad(d); }
      function parseKey(key) {
        var p = key.split("-");
        return new Date(+p[0], +p[1] - 1, +p[2]);
      }
      function isWeekend(date) {
        var w = date.getDay();
        return w === 0 || w === 6;
      }

      function loadData() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            var parsed = JSON.parse(raw);
            return {
              checkins: parsed.checkins || {},
              holidays: parsed.holidays || [],
              onleave: parsed.onleave || {}
            };
          }
        } catch (e) { /* ignore */ }
        return { checkins: {}, holidays: [], onleave: {} };
      }

      function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
      }

      function isHoliday(key) { return state.data.holidays.indexOf(key) !== -1; }
      function isOnLeave(key) { return !!state.data.onleave[key]; }
      function getCheckin(key) { return state.data.checkins[key] || null; }

      function workDayWeight(key) {
        var date = parseKey(key);
        if (isWeekend(date)) return 0;
        if (isHoliday(key)) return 0;
        if (isOnLeave(key)) return 0.5;
        return 1;
      }

      function checkinWeight(key, halfAsFull) {
        var c = getCheckin(key);
        if (c === "full") return 1;
        if (c === "half") return halfAsFull ? 1 : 0.5;
        return 0;
      }

      function monthStats(year, month) {
        var days = new Date(year, month, 0).getDate();
        var workDays = 0, checkFull = 0, checkHalf = 0, checkedDays = 0;
        for (var d = 1; d <= days; d++) {
          var key = dateKey(year, month, d);
          workDays += workDayWeight(key);
          checkFull += checkinWeight(key, true);
          checkHalf += checkinWeight(key, false);
          if (getCheckin(key)) checkedDays++;
        }
        return {
          workDays: workDays,
          checkFull: checkFull,
          checkHalf: checkHalf,
          checkedDays: checkedDays,
          ratioFull: workDays > 0 ? checkFull / workDays : 0,
          ratioHalf: workDays > 0 ? checkHalf / workDays : 0,
          weeks: buildMonthWeeks(year, month)
        };
      }

      /** Calendar rows (Sun–Sat) with full-week date keys, including adjacent-month days. */
      function weekRangeLabel(cells) {
        var f = parseKey(cells[0].key);
        var l = parseKey(cells[6].key);
        return (f.getMonth() + 1) + "/" + f.getDate() + "–" + (l.getMonth() + 1) + "/" + l.getDate();
      }

      function buildWeekCells(sunday) {
        var cells = [];
        for (var i = 0; i < 7; i++) {
          var d = new Date(sunday);
          d.setDate(sunday.getDate() + i);
          var cy = d.getFullYear();
          var cm = d.getMonth() + 1;
          var cd = d.getDate();
          cells.push({
            key: dateKey(cy, cm, cd),
            day: cd,
            inMonth: false
          });
        }
        return cells;
      }

      function buildWeekFromSunday(sunday, year, month) {
        var cells = buildWeekCells(sunday);
        if (year != null && month != null) {
          cells.forEach(function (c) {
            var p = c.key.split("-");
            c.inMonth = +p[0] === year && +p[1] === month;
          });
        }
        return {
          cells: cells,
          rangeLabel: weekRangeLabel(cells),
          startKey: cells[0].key,
          endKey: cells[6].key
        };
      }

      function buildMonthWeeks(year, month) {
        var daysInMonth = new Date(year, month, 0).getDate();
        var firstOfMonth = new Date(year, month - 1, 1);
        var lastKey = dateKey(year, month, daysInMonth);
        var cursor = new Date(firstOfMonth);
        cursor.setDate(cursor.getDate() - cursor.getDay());

        var weeks = [];
        var weekNum = 1;
        var seenLast = false;

        while (!seenLast) {
          var wk = buildWeekFromSunday(new Date(cursor), year, month);
          if (wk.cells.some(function (c) { return c.inMonth; })) {
            wk.num = weekNum++;
            weeks.push(wk);
            if (wk.cells.some(function (c) { return c.key === lastKey; })) seenLast = true;
          }
          cursor.setDate(cursor.getDate() + 7);
        }

        return weeks;
      }

      /** Extended week sequence for multi-week period analysis (can cross months). */
      function buildAnalysisWeeks(year, month) {
        var core = buildMonthWeeks(year, month);
        if (!core.length) return [];

        var firstSun = parseKey(core[0].cells[0].key);
        var lastSun = parseKey(core[core.length - 1].cells[0].key);
        var start = new Date(firstSun);
        start.setDate(start.getDate() - 7 * (MAX_PERIOD - 1));
        var end = new Date(lastSun);
        end.setDate(end.getDate() + 7 * (MAX_PERIOD - 1));

        var weeks = [];
        var cursor = new Date(start);
        while (cursor <= end) {
          weeks.push(buildWeekFromSunday(new Date(cursor)));
          cursor.setDate(cursor.getDate() + 7);
        }
        return weeks;
      }

      function weekStatsForRow(cells, halfAsFull) {
        var work = 0;
        var check = 0;
        cells.forEach(function (cell) {
          work += workDayWeight(cell.key);
          check += checkinWeight(cell.key, halfAsFull);
        });
        return {
          workDays: work,
          checkin: check,
          ratio: work > 0 ? check / work : null
        };
      }

      function weekResultsFromWeeks(weeks, halfAsFull) {
        return weeks.map(function (wk) {
          var st = weekStatsForRow(wk.cells, halfAsFull);
          return {
            cells: wk.cells,
            rangeLabel: wk.rangeLabel,
            workDays: st.workDays,
            checkin: st.checkin,
            ratio: st.ratio,
            hasWork: st.workDays > 0
          };
        });
      }

      function findFailingPeriods(weekResults, periodLen) {
        var failing = [];
        for (var i = 0; i <= weekResults.length - periodLen; i++) {
          var work = 0;
          var check = 0;
          for (var j = 0; j < periodLen; j++) {
            work += weekResults[i + j].workDays;
            check += weekResults[i + j].checkin;
          }
          if (work <= 0) continue;
          if (check / work < THRESHOLD) {
            failing.push({ start: i, end: i + periodLen - 1, len: periodLen });
          }
        }
        return failing;
      }

      function periodTouchesMonth(period, weekResults, year, month) {
        for (var i = period.start; i <= period.end; i++) {
          if (weekResults[i].cells.some(function (c) {
            var p = c.key.split("-");
            return +p[0] === year && +p[1] === month;
          })) return true;
        }
        return false;
      }

      function buildThreeMonthWeekSequence(anchorY, anchorM) {
        var prev = shiftYM(anchorY, anchorM, -1);
        var next = shiftYM(anchorY, anchorM, 1);
        var firstOfPrev = new Date(prev.year, prev.month - 1, 1);
        var daysInNext = new Date(next.year, next.month, 0).getDate();
        var lastOfNext = new Date(next.year, next.month - 1, daysInNext);

        var cursor = new Date(firstOfPrev);
        cursor.setDate(cursor.getDate() - cursor.getDay());
        var end = new Date(lastOfNext);
        end.setDate(end.getDate() + (6 - end.getDay()));

        var weeks = [];
        while (cursor <= end) {
          weeks.push(buildWeekFromSunday(new Date(cursor)));
          cursor.setDate(cursor.getDate() + 7);
        }
        return weeks;
      }

      function formatPeriodDateRange(startIdx, endIdx, weeks) {
        var f = parseKey(weeks[startIdx].cells[0].key);
        var l = parseKey(weeks[endIdx].cells[6].key);
        return (f.getMonth() + 1) + "月" + f.getDate() + "日–" + (l.getMonth() + 1) + "月" + l.getDate() + "日";
      }

      function formatGlobalWeekRange(startIdx, endIdx, weeks) {
        return formatPeriodDateRange(startIdx, endIdx, weeks);
      }

      function periodCombinedStats(results, start, end) {
        var work = 0;
        var check = 0;
        for (var i = start; i <= end; i++) {
          work += results[i].workDays;
          check += results[i].checkin;
        }
        var ratio = work > 0 ? check / work : 0;
        return {
          work: work,
          check: check,
          ratio: ratio,
          pct: Math.round(ratio * 1000) / 10
        };
      }

      function formatWeekShortDates(cells) {
        var f = parseKey(cells[0].key);
        var l = parseKey(cells[6].key);
        return (f.getMonth() + 1) + "/" + f.getDate() + "–" + (l.getMonth() + 1) + "/" + l.getDate();
      }

      function formatPeriodDay(cells, which) {
        var d = parseKey(cells[which === "start" ? 0 : 6].key);
        return (d.getMonth() + 1) + "月" + d.getDate() + "日";
      }

      function buildFailWindowItemHtml(p, weeks, results, num, len) {
        var stats = periodCombinedStats(results, p.start, p.end);
        var startDay = formatPeriodDay(weeks[p.start].cells, "start");
        var endDay = formatPeriodDay(weeks[p.end].cells, "end");
        var weekLines = [];
        var i;
        for (i = p.start; i <= p.end; i++) {
          var pos = i - p.start + 1;
          var r = results[i];
          var dates = formatWeekShortDates(weeks[i].cells);
          var pct = r.hasWork ? Math.round(r.ratio * 1000) / 10 : null;
          var pass = r.hasWork && r.ratio >= THRESHOLD;
          var mark = pos === 1 ? "起" : pos === len ? "止" : "·";
          weekLines.push(
            '<li class="fail-window__week">' +
              '<span class="fail-window__mark">' + mark + "</span>" +
              "<span>第" + pos + "周 " + dates + "</span>" +
              '<span class="fail-window__pct ' + (pass ? "is-pass" : "is-fail") + '">' + (pct != null ? pct + "%" : "—") + "</span>" +
            "</li>"
          );
        }
        return (
          '<article class="fail-window fail-window--len-' + len + '">' +
            '<header class="fail-window__head">' +
              '<span class="fail-window__num">' + num + "</span>" +
              '<span class="fail-window__range">从 <strong>' + startDay + "</strong> 起 → 到 <strong>" + endDay + "</strong> 止</span>" +
              '<span class="fail-window__total">合计 ' + stats.pct + "%</span>" +
            "</header>" +
            '<ol class="fail-window__weeks">' + weekLines.join("") + "</ol>" +
          "</article>"
        );
      }

      function buildFailLengthSectionHtml(len, fails, weeks, results) {
        var items = fails.map(function (p, idx) {
          return buildFailWindowItemHtml(p, weeks, results, idx + 1, len);
        }).join("");
        return (
          '<section class="fail-report__group fail-report__group--len-' + len + '">' +
            '<h4 class="fail-report__group-title">连续 ' + len + " 周未达标<span class=\"fail-report__count\">" + fails.length + " 处</span></h4>" +
            '<div class="fail-report__items">' + items + "</div>" +
          "</section>"
        );
      }

      function buildWeekPanelHtml() {
        var data = getTripleDashboardData();
        var weeks = data.weeks;
        var results = data.results;
        var sections = [];
        var anyFail = false;
        var len;

        for (len = MAX_PERIOD; len >= 1; len--) {
          var fails = findFailingPeriods(results, len);
          if (!fails.length) continue;
          anyFail = true;
          sections.push(buildFailLengthSectionHtml(len, fails, weeks, results));
        }

        if (!anyFail) {
          return (
            '<h3 class="fail-report__title">未达标明细</h3>' +
            '<p class="fail-report__empty">连续 1～' + MAX_PERIOD + " 周窗口全部达标</p>"
          );
        }

        return (
          '<h3 class="fail-report__title">未达标明细</h3>' +
          '<p class="fail-report__hint">按<strong>连续周数</strong>分组，列出全部未达 40% 的窗口。每条写明从哪一天起、到哪一天止，以及区间内每一周的情况。</p>' +
          sections.join("")
        );
      }

      function getTripleDashboardData() {
        var halfAsFull = state.dashboardMode === "full";
        var weeks = buildThreeMonthWeekSequence(state.anchorYear, state.anchorMonth);
        var results = weekResultsFromWeeks(weeks, halfAsFull);
        return { weeks: weeks, results: results, halfAsFull: halfAsFull };
      }

      function buildMonthStripHtml(anchorY, anchorM) {
        var halfAsFull = state.dashboardMode === "full";
        var prev = shiftYM(anchorY, anchorM, -1);
        var next = shiftYM(anchorY, anchorM, 1);
        var slots = [
          { label: "前月", year: prev.year, month: prev.month, role: "adj" },
          { label: "中月", year: anchorY, month: anchorM, role: "curr" },
          { label: "后月", year: next.year, month: next.month, role: "adj" }
        ];
        return (
          '<div class="month-strip">' +
            slots.map(function (slot) {
              var s = monthStats(slot.year, slot.month);
              var ratio = halfAsFull ? s.ratioFull : s.ratioHalf;
              var check = halfAsFull ? s.checkFull : s.checkHalf;
              var pct = Math.round(ratio * 1000) / 10;
              var pass = ratio >= THRESHOLD;
              var cls = "month-strip__card" + (slot.role === "curr" ? " month-strip__card--curr" : "");
              return (
                '<article class="' + cls + '">' +
                  '<div class="month-strip__label">' + slot.label + "</div>" +
                  '<div class="month-strip__name">' + formatMonth(slot.year, slot.month) + "</div>" +
                  '<div class="month-strip__meta">' + check + " / " + s.workDays + " 工作日 · " + s.checkedDays + " 天有打卡</div>" +
                  '<div class="month-strip__pct ' + (pass ? "is-pass" : "is-fail") + '">' + pct + "%</div>" +
                "</article>"
              );
            }).join("") +
          "</div>"
        );
      }

      function buildPeriodSectionHtml() {
        if (!state.tripleView) return "";

        var data = getTripleDashboardData();
        var weeks = data.weeks;
        var results = data.results;
        var prev = shiftYM(state.anchorYear, state.anchorMonth, -1);
        var next = shiftYM(state.anchorYear, state.anchorMonth, 1);

        var fail5 = findFailingPeriods(results, 5);
        var alertHtml;
        if (fail5.length) {
          var ranges5 = fail5.map(function (p) {
            return formatGlobalWeekRange(p.start, p.end, weeks);
          }).join("；");
          alertHtml = '<div class="alert alert--fail"><strong>⚠ 连续 5 周未达 40%</strong>：' + ranges5 + "</div>";
        } else {
          var fail4 = findFailingPeriods(results, 4);
          if (fail4.length) {
            alertHtml = '<div class="alert alert--warn"><strong>无 5 周未达标</strong>，但有 4 周周期未达标：' +
              fail4.map(function (p) { return formatGlobalWeekRange(p.start, p.end, weeks); }).join("；") + "</div>";
          } else {
            alertHtml = '<div class="alert alert--ok"><strong>✓ 连续 5 周全部达标</strong></div>';
          }
        }

        return (
          '<div class="period-section">' +
            '<div class="period-dashboard">' +
              '<div class="period-dashboard__head">' +
                '<h2 class="period-dashboard__title">周期总览 · ' + formatMonth(prev.year, prev.month) + " – " + formatMonth(next.year, next.month) + "</h2>" +
                '<span class="period-dashboard__mode">' + getDashboardMode().shortLabel + "</span>" +
              "</div>" +
              alertHtml +
              '<div class="period-stack">' +
                '<div class="period-week-block">' + buildWeekPanelHtml() + "</div>" +
              "</div>" +
            "</div>" +
          "</div>"
        );
      }

      function renderMainPanelHead() {
        var prev = shiftYM(state.anchorYear, state.anchorMonth, -1);
        var next = shiftYM(state.anchorYear, state.anchorMonth, 1);
        var title = state.tripleView
          ? "三个月连续 · " + formatMonth(prev.year, prev.month) + " – " + formatMonth(next.year, next.month)
          : "双月 · " + formatMonth(prev.year, prev.month) + " – " + formatMonth(state.anchorYear, state.anchorMonth);
        var navLabel = state.tripleView ? "切换中月" : "切换本月";
        var navHtml =
          '<nav class="month-nav" aria-label="' + navLabel + '">' +
            '<button type="button" class="month-nav__btn" data-anchor="prev" aria-label="往前一月">‹</button>' +
            '<span class="month-nav__label">' + formatMonth(state.anchorYear, state.anchorMonth) + "</span>" +
            '<button type="button" class="month-nav__btn" data-anchor="next" aria-label="往后一月">›</button>' +
          "</nav>";
        document.getElementById("mainPanelHead").innerHTML =
          '<h2 class="card__title">' + title + "</h2>" +
          '<div class="main-panel__toolbar">' +
            navHtml +
            buildModeToggleHtml() +
            '<button type="button" class="btn btn--ghost btn--sm' + (state.tripleView ? " is-on" : "") + '" id="btnTripleView">' +
              (state.tripleView ? "双月视图" : "三月视图") +
            "</button>" +
          "</div>";
      }

      function clearDayState(key) {
        delete state.data.checkins[key];
        var hi = state.data.holidays.indexOf(key);
        if (hi !== -1) state.data.holidays.splice(hi, 1);
        delete state.data.onleave[key];
      }

      function periodReportHtml(year, month, halfAsFull, modeLabel) {
        var weeks = buildAnalysisWeeks(year, month);
        var results = weekResultsFromWeeks(weeks, halfAsFull);
        var lines = [];

        for (var len = 1; len <= MAX_PERIOD; len++) {
          var filtered = findFailingPeriods(results, len).filter(function (p) {
            return periodTouchesMonth(p, results, year, month);
          });

          if (!filtered.length) {
            lines.push('<div class="period-line"><strong>' + len + '周周期：</strong><span class="period-line--ok">全部达标</span></div>');
            continue;
          }

          var ranges = filtered.map(function (p) {
            return formatPeriodDateRange(p.start, p.end, weeks);
          }).join("；");
          lines.push('<div class="period-line"><strong>' + len + '周周期未达 40%：</strong>' + ranges + '</div>');
        }

        return (
          '<div class="week-block week-block--period">' +
            '<div class="week-block__title">周期达标 · ' + modeLabel + '</div>' +
            '<div class="week-block__sub">连续 1–5 个自然周合并计算（周日–周六，可跨月）</div>' +
            '<div class="period-lines">' + lines.join("") + '</div>' +
          '</div>'
        );
      }

      function weekReportHtml(weeks, halfAsFull, modeLabel) {
        var results = weeks.map(function (wk) {
          var st = weekStatsForRow(wk.cells, halfAsFull);
          return {
            label: formatWeekShortDates(wk.cells),
            workDays: st.workDays,
            checkin: st.checkin,
            ratio: st.ratio,
            hasWork: st.workDays > 0
          };
        });

        var rows = results.map(function (w) {
          if (!w.hasWork) {
            return (
              '<div class="week-row">' +
                '<span class="week-row__label">' + w.label + '</span>' +
                '<span style="grid-column:span 2;color:var(--ink-faint)">无工作日</span>' +
              '</div>'
            );
          }
          var pct = Math.round(w.ratio * 1000) / 10;
          var pass = w.ratio >= THRESHOLD;
          return (
            '<div class="week-row">' +
              '<span class="week-row__label">' + w.label + '</span>' +
              '<div class="week-row__bar"><div class="week-row__fill ' + (pass ? "is-pass" : "is-fail") + '" style="width:' + Math.min(100, pct) + '%"></div></div>' +
              '<span class="badge ' + (pass ? "badge--pass" : "badge--fail") + '">' + pct + '%</span>' +
            '</div>'
          );
        }).join("");

        return (
          '<div class="week-block">' +
            '<div class="week-block__title">单周达标 · ' + modeLabel + '</div>' +
            '<div class="week-block__sub">按完整自然周计算（周日–周六，含跨月日期）</div>' +
            '<div class="week-rows">' + rows + '</div>' +
          '</div>'
        );
      }

      function formatMonth(y, m) { return y + "年" + m + "月"; }

      function formatDateLabel(key) {
        var d = parseKey(key);
        return d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日 周" + WEEKDAYS[d.getDay()];
      }

      function dayMeta(key) {
        var parts = [];
        var date = parseKey(key);
        if (isWeekend(date)) parts.push("双休日（默认放假）");
        if (isHoliday(key)) parts.push("已标记放假日");
        if (isOnLeave(key)) parts.push("半天请假");
        var c = getCheckin(key);
        if (c === "full") parts.push("已打卡·全天");
        else if (c === "half") parts.push("已打卡·半天");
        else if (!parts.length) parts.push("工作日，未打卡");
        else if (!c) parts.push("未打卡");
        return parts.join(" · ");
      }

      function cellClass(key) {
        var date = parseKey(key);
        if (isHoliday(key)) return "is-holiday";
        if (isOnLeave(key)) return "is-leave";
        var c = getCheckin(key);
        if (c === "full") return "is-full";
        if (c === "half") return "is-half";
        if (isWeekend(date)) return "is-weekend";
        return "";
      }

      function showToast(msg) {
        var el = document.getElementById("toast");
        el.textContent = msg;
        el.classList.add("is-visible");
        clearTimeout(showToast._t);
        showToast._t = setTimeout(function () { el.classList.remove("is-visible"); }, 2200);
      }

      function ratioHtml(label, ratio, val, work) {
        var pct = Math.round(ratio * 1000) / 10;
        var pass = ratio >= THRESHOLD;
        return (
          '<div class="ratio-block">' +
            '<div class="ratio-block__row"><span>' + label + '</span>' +
            '<span class="badge ' + (pass ? "badge--pass" : "badge--fail") + '">' + (pass ? "≥40%" : "<40%") + '</span></div>' +
            '<div class="ratio-bar"><div class="ratio-bar__fill" style="width:' + Math.min(100, pct) + '%"></div><div class="ratio-bar__mark"></div></div>' +
            '<div style="margin-top:4px;color:var(--ink-soft)">' + val + ' / ' + work + ' 工作日 = ' + pct + '%</div>' +
          '</div>'
        );
      }

      function buildCalendarHtml(year, month, weeks) {
        var todayKey = dateKey(today.getFullYear(), today.getMonth() + 1, today.getDate());
        var html = '<div class="cal" role="grid">';
        WEEKDAYS.forEach(function (w) {
          html += '<div class="cal__wd" role="columnheader">' + w + '</div>';
        });

        weeks.forEach(function (wk) {
          wk.cells.forEach(function (cell) {
            var cls = ["cal__cell", cellClass(cell.key)];
            if (!cell.inMonth) cls.push("is-outside");
            if (cell.monthSlot === "curr") cls.push("is-curr-month");
            else if (cell.monthSlot === "prev" || cell.monthSlot === "next") cls.push("is-adj-month");
            if (cell.key === todayKey) cls.push("is-today");
            if (cell.key === state.selectedKey) cls.push("is-selected");
            html += '<button type="button" class="' + cls.join(" ") + '" data-key="' + cell.key + '" aria-label="' + formatDateLabel(cell.key) + '"><span class="cal__cell__num">' + cell.day + '</span></button>';
          });
        });

        html += '</div>';
        return html;
      }

      function buildMergedCalendarWeeks(anchorY, anchorM) {
        var prev = shiftYM(anchorY, anchorM, -1);
        var next = shiftYM(anchorY, anchorM, 1);
        var weeks = buildThreeMonthWeekSequence(anchorY, anchorM);
        weeks.forEach(function (wk) {
          wk.cells.forEach(function (cell) {
            var p = cell.key.split("-");
            var y = +p[0];
            var m = +p[1];
            if (y === anchorY && m === anchorM) {
              cell.monthSlot = "curr";
              cell.inMonth = true;
            } else if (y === prev.year && m === prev.month) {
              cell.monthSlot = "prev";
              cell.inMonth = false;
            } else if (y === next.year && m === next.month) {
              cell.monthSlot = "next";
              cell.inMonth = false;
            } else {
              cell.monthSlot = "edge";
              cell.inMonth = false;
            }
          });
        });
        return weeks;
      }

      function buildMergedCalendarHtml(anchorY, anchorM) {
        var prev = shiftYM(anchorY, anchorM, -1);
        var next = shiftYM(anchorY, anchorM, 1);
        var weeks = buildMergedCalendarWeeks(anchorY, anchorM);
        var todayKey = dateKey(today.getFullYear(), today.getMonth() + 1, today.getDate());
        var bands = {
          prev: formatMonth(prev.year, prev.month),
          curr: formatMonth(anchorY, anchorM),
          next: formatMonth(next.year, next.month)
        };
        var shown = { prev: false, curr: false, next: false };
        var html = '<div class="cal cal--merged" role="grid">';
        WEEKDAYS.forEach(function (w) {
          html += '<div class="cal__wd" role="columnheader">' + w + '</div>';
        });

        weeks.forEach(function (wk) {
          wk.cells.forEach(function (cell) {
            if (cell.monthSlot && cell.monthSlot !== "edge" && !shown[cell.monthSlot]) {
              shown[cell.monthSlot] = true;
              var bandCls = "cal__month-band" + (cell.monthSlot === "curr" ? " cal__month-band--curr" : "");
              html += '<div class="' + bandCls + '">' + bands[cell.monthSlot] + "</div>";
            }
            var cls = ["cal__cell", cellClass(cell.key)];
            if (cell.monthSlot === "curr") cls.push("is-curr-month");
            else if (cell.monthSlot === "prev" || cell.monthSlot === "next") cls.push("is-adj-month");
            else cls.push("is-adj-month");
            if (cell.key === todayKey) cls.push("is-today");
            if (cell.key === state.selectedKey) cls.push("is-selected");
            html += '<button type="button" class="' + cls.join(" ") + '" data-key="' + cell.key + '" aria-label="' + formatDateLabel(cell.key) + '"><span class="cal__cell__num">' + cell.day + '</span></button>';
          });
        });

        html += "</div>";
        return html;
      }

      function renderMonths() {
        var grid = document.getElementById("monthGrid");
        if (state.tripleView) {
          var mode = getDashboardMode();
          grid.classList.add("month-grid--triple");
          grid.innerHTML =
            '<p class="merged-cal-pane__hint"><strong>黑色</strong>为中月（' + formatMonth(state.anchorYear, state.anchorMonth) + '），<strong>灰色</strong>为前月/后月</p>' +
            buildMergedCalendarHtml(state.anchorYear, state.anchorMonth) +
            '<section class="month-stats-footer">' +
              '<h3 class="month-stats-footer__title">三月统计 · ' + mode.label + "</h3>" +
              buildMonthStripHtml(state.anchorYear, state.anchorMonth) +
            "</section>";
          return;
        }

        grid.classList.remove("month-grid--triple");
        var display = getDisplayMonths();
        var mode = getDashboardMode();
        grid.innerHTML = display.map(function (slot) {
          var s = monthStats(slot.year, slot.month);
          var ratio = mode.halfAsFull ? s.ratioFull : s.ratioHalf;
          var check = mode.halfAsFull ? s.checkFull : s.checkHalf;
          var detailHtml =
            weekReportHtml(s.weeks, mode.halfAsFull, mode.label) +
            periodReportHtml(slot.year, slot.month, mode.halfAsFull, mode.label);
          return (
            '<article class="card">' +
              '<div class="card__head">' +
                '<h2 class="card__title">' + slot.label + " · " + formatMonth(slot.year, slot.month) + "</h2>" +
              "</div>" +
              '<div class="card__body">' +
                buildCalendarHtml(slot.year, slot.month, s.weeks) +
                '<section class="month-stats-footer">' +
                  '<h3 class="month-stats-footer__title">' + slot.label + "统计 · " + mode.label + "</h3>" +
                  '<div class="stat-row">' +
                    '<div class="stat"><div class="stat__label">工作日</div><div class="stat__value">' + s.workDays + "</div></div>" +
                    '<div class="stat"><div class="stat__label">有打卡</div><div class="stat__value">' + s.checkedDays + " 天</div></div>" +
                  "</div>" +
                  ratioHtml(mode.label, ratio, check, s.workDays) +
                  detailHtml +
                "</section>" +
              "</div>" +
            "</article>"
          );
        }).join("");
      }

      function renderLegend() {
        var items = [
          { cls: "", bg: "var(--checkin)", label: "全天打卡" },
          { cls: " legend__swatch--half", bg: "", label: "半天打卡" },
          { cls: "", bg: "var(--holiday)", label: "放假日" },
          { cls: " legend__swatch--leave", bg: "", label: "半天请假" },
          { cls: "", bg: "var(--weekend)", label: "双休日" }
        ];
        if (state.tripleView) {
          items.push({ cls: " legend__swatch--curr", bg: "var(--ink)", label: "中月" });
          items.push({ cls: " legend__swatch--adj", bg: "var(--ink-faint)", label: "前月/后月" });
        }
        document.getElementById("legend").innerHTML = items.map(function (it) {
          var style = it.bg ? ' style="background:' + it.bg + '"' : "";
          return '<span class="legend__item"><span class="legend__swatch' + it.cls + '"' + style + '></span>' + it.label + '</span>';
        }).join("");
      }

      function openSheet(key) {
        state.selectedKey = key;
        state.pendingAction = null;
        document.body.classList.add("sheet-open");
        document.getElementById("sheetBackdrop").classList.add("is-open");
        document.getElementById("sheet").classList.add("is-open");
        document.getElementById("sheetDate").textContent = formatDateLabel(key);
        document.getElementById("sheetMeta").textContent = dayMeta(key);
        renderSheetActions();
        render();
      }

      function closeSheet() {
        state.pendingAction = null;
        document.body.classList.remove("sheet-open");
        document.getElementById("sheetBackdrop").classList.remove("is-open");
        document.getElementById("sheet").classList.remove("is-open");
        state.selectedKey = null;
        render();
      }

      function actionBtnHtml(a, key) {
        var active = state.pendingAction === a.id ? " is-active" : "";
        var on = "";
        var c = getCheckin(key);
        if (a.id === "checkin-full" && c === "full") on = " is-on-checkin";
        if (a.id === "checkin-half" && c === "half") on = " is-on-half-checkin";
        if (a.id === "holiday-toggle" && isHoliday(key)) on = " is-on-holiday";
        if (a.id === "leave-toggle" && isOnLeave(key)) on = " is-on-leave";
        return (
          '<button type="button" class="btn btn--chip' + active + on + '" data-pending="' + a.id + '">' +
            a.label + '<span style="display:block;font-size:11px;font-weight:400;opacity:.7">' + a.hint + '</span>' +
          '</button>'
        );
      }

      function renderSheetActions() {
        var key = state.selectedKey;
        if (!key) return;
        document.getElementById("checkinActions").innerHTML = CHECKIN_ACTIONS.map(function (a) {
          return actionBtnHtml(a, key);
        }).join("");
        document.getElementById("markActions").innerHTML = MARK_ACTIONS.map(function (a) {
          return actionBtnHtml(a, key);
        }).join("");
        document.getElementById("btnSheetConfirm").disabled = !state.pendingAction;
      }

      function applyAction(key, action) {
        var date = parseKey(key);
        if (action === "clear-checkin") {
          clearDayState(key);
        } else if (action === "checkin-full") {
          clearDayState(key);
          state.data.checkins[key] = "full";
        } else if (action === "checkin-half") {
          clearDayState(key);
          state.data.checkins[key] = "half";
        } else if (action === "holiday-toggle") {
          if (isWeekend(date)) {
            showToast("双休日已默认放假");
            return false;
          }
          if (isHoliday(key)) {
            var hi = state.data.holidays.indexOf(key);
            if (hi !== -1) state.data.holidays.splice(hi, 1);
          } else {
            clearDayState(key);
            state.data.holidays.push(key);
          }
        } else if (action === "leave-toggle") {
          if (isWeekend(date)) {
            showToast("只能在工作日标记请假");
            return false;
          }
          if (isOnLeave(key)) {
            delete state.data.onleave[key];
          } else {
            clearDayState(key);
            state.data.onleave[key] = "half";
          }
        }
        saveData();
        return true;
      }

      function confirmSheet() {
        if (!state.selectedKey || !state.pendingAction) return;
        var action = state.pendingAction;
        var ok = applyAction(state.selectedKey, action);
        if (!ok) return;
        var msgs = {
          "checkin-full": "已全天打卡",
          "checkin-half": "已半天打卡",
          "clear-checkin": "已清除所有状态",
          "holiday-toggle": isHoliday(state.selectedKey) ? "已标记放假日" : "已取消放假日",
          "leave-toggle": isOnLeave(state.selectedKey) ? "已标记半天请假" : "已取消请假"
        };
        showToast(msgs[action] || "已保存");
        closeSheet();
        render();
      }

      function quickCheckin(full) {
        var key = dateKey(today.getFullYear(), today.getMonth() + 1, today.getDate());
        clearDayState(key);
        state.data.checkins[key] = full ? "full" : "half";
        saveData();
        showToast(full ? "今日全天打卡成功" : "今日半天打卡成功");
        render();
      }

      function shiftAnchor(dir) {
        var s = shiftYM(state.anchorYear, state.anchorMonth, dir === "prev" ? -1 : 1);
        state.anchorYear = s.year;
        state.anchorMonth = s.month;
        render();
      }

      function render() {
        renderMainPanelHead();
        document.getElementById("periodSection").innerHTML = buildPeriodSectionHtml();
        renderMonths();
        renderLegend();
      }

      // Event delegation — survives innerHTML re-renders
      document.addEventListener("click", function (e) {
        var calCell = e.target.closest(".cal__cell[data-key]");
        if (calCell) {
          e.preventDefault();
          openSheet(calCell.getAttribute("data-key"));
          return;
        }

        var pendingBtn = e.target.closest("[data-pending]");
        if (pendingBtn) {
          state.pendingAction = pendingBtn.getAttribute("data-pending");
          renderSheetActions();
          return;
        }

        var quickBtn = e.target.closest("[data-quick]");
        if (quickBtn) {
          quickCheckin(quickBtn.getAttribute("data-quick") === "full");
          return;
        }

        if (e.target.id === "btnTripleView") {
          state.tripleView = !state.tripleView;
          render();
          return;
        }

        var anchorBtn = e.target.closest("[data-anchor]");
        if (anchorBtn) {
          shiftAnchor(anchorBtn.getAttribute("data-anchor"));
          return;
        }

        var modeBtn = e.target.closest("[data-dashboard-mode]");
        if (modeBtn) {
          state.dashboardMode = modeBtn.getAttribute("data-dashboard-mode");
          render();
          return;
        }

        if (e.target.closest("[data-action=export]")) {
          var blob = new Blob([JSON.stringify(state.data, null, 2)], { type: "application/json" });
          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "daka-backup-" + dateKey(today.getFullYear(), today.getMonth() + 1, today.getDate()) + ".json";
          a.click();
          URL.revokeObjectURL(a.href);
          showToast("已导出");
          return;
        }

        if (e.target.id === "btnSheetConfirm") {
          confirmSheet();
          return;
        }

        if (e.target.id === "btnSheetClose" || e.target.id === "sheetBackdrop") {
          closeSheet();
        }
      });

      document.getElementById("importFile").addEventListener("change", function (ev) {
        var file = ev.target.files && ev.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          try {
            var parsed = JSON.parse(reader.result);
            state.data = {
              checkins: parsed.checkins || {},
              holidays: parsed.holidays || [],
              onleave: parsed.onleave || {}
            };
            saveData();
            render();
            showToast("导入成功");
          } catch (err) {
            showToast("导入失败");
          }
        };
        reader.readAsText(file);
        ev.target.value = "";
      });

      render();
    })();
  </script>
</body>
</html>
